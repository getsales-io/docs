            entries:
              type: array
              items:
                type: object
                properties:
                  operation:
                    type: string
                    enum:
                      - llm.generate
                      - llm.embed
                      - email.find
                      - email.verify
                      - http.request
                      - crm.contact_upsert
                      - crm.company_upsert
                      - crm.associate
                      - crm.properties_list
                      - serp.search
                      - audio.transcribe
                    description: The operation.
                  provider:
                    type: string
                    enum:
                      - openai
                      - anthropic
                      - google
                      - deepseek
                      - xai
                      - voyage
                      - cohere
                      - hunter
                      - findymail
                      - anymailfinder
                      - emaillistverify
                      - custom
                      - hubspot
                      - serper
                    description: The adapter.
                  model:
                    type: string
                    nullable: true
                    description: One entry per priced model on llm and audio operations; null elsewhere.
