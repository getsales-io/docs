                    type: boolean
                    description: true = a platform key is configured, callable now; a crm entry has none by design (it runs on the team's grant).
                  pricing_unit:
                    type: string
                    description: "per_call (the rate is the product's own credit price for the vendor) | per_token (the vendor's dollars per token plus the product's margin, 2026-10-30: a call is billed on its own token counts)."
                  price_min:
                    type: number
                    description: "Credits, a quote with no prompt in hand: a per_call rate; for a per_token entry a short reference call (200 tokens in, 50 out)."
                  price_expected:
                    type: number
                    description: "Credits, the quote of a typical call (1,000 in, 300 out). A row of a Use AI column is priced on its own prompt instead: estimate_playtable_field_ai_cost."
                  price_max:
                    type: number
                    description: Credits, the quote of the reference prompt with the model's whole output cap.
                  credits_per_mtok_input:
                    type: number
                    nullable: true
                    description: "per_token: the credits a million input tokens cost a team, the vendor's price with the margin at the rate; null on a per_call entry."
                  credits_per_mtok_output:
                    type: number
                    nullable: true
                    description: "per_token: the same for output tokens; 0 where the vendor bills none (an embedding)."
                  max_tokens:
                    type: integer
                    nullable: true
                    description: "per_token: the model's completion cap, the ceiling of a row's price."
                  cacheable:
                    type: boolean
                    description: "email.find and email.verify: a repeat is free."
                  web_search:
                    type: boolean
                    description: "llm.generate: the model can run the vendor's web search."
