    WebhookDelivery:
      description: "One delivery of one event, the body POSTed to a subscription's target_url, by its `type` (33 catalog events). Headers: X-Webhook-Signature t=<unix seconds>,v1=<hex>, where hex = HMAC-SHA256(secret, \"<t>.<raw body>\"), to verify over the raw body; X-Webhook-Id (the subscription), X-Webhook-Log-Id (= webhook_log_sid, the same on every retry), X-Webhook-Event, X-Webhook-Timestamp, X-Trace-Id. Any 2xx counts as delivered; a 3xx (redirects are not followed), 5xx, 408, 429 or no answer is retried (5 attempts in all, 1 minute, 5 minutes, 30 minutes and 2 hours apart); a 410, or 20 failures in a row, switch the subscription off (webhooks.failed). On a forwarded event every string of the payload arrives trimmed, an empty string as null and an empty object as []."
      oneOf:
        - $ref: "#/components/schemas/WebhookDeliveryDataSourcesCompleted"
        - $ref: "#/components/schemas/WebhookDeliveryDataSourcesFailed"
        - $ref: "#/components/schemas/WebhookDeliveryDataSourcesPaused"
