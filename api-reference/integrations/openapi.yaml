              - sender-profiles.deleted
              - sender-profiles.health-changed
              - agents.mode-changed
              - signals.website-visited
              - website-sites.broken
              - website-sites.recovered
              - webhooks.failed
              - "*"
          minItems: 1
          description: FULL replacement of the subscribed types; exactly ["*"] for all of them.
        filters:
          type: object
          nullable: true
          properties:
            account_sid:
              type: string
              nullable: true
              minLength: 18
              maxLength: 18
              description: "Deliver only the events of this sender profile (ub_sp_...): its own and its threads' messages, conversations and tasks. Events of no sender profile (tables, imports, workflows, website visits) never reach a narrowed subscription. null = no narrowing."
            where:
              type: object
              nullable: true
              additionalProperties: {}
              description: "Payload gate: a FilterAst tree evaluated on the delivery envelope, so leaves address payload.* and type and occurred_at. Nodes: {and: [...]}, {or: [...]}, {not: node}, leaf {field, op: {atom: value}}, and {any: {path, where}} over an array of objects, its leaf fields relative to the element (a list of scalars takes eq or in directly). Atoms: eq, ne, in, nin, gt, gte, lt, lte, is_null, contains, not_contains, contains_any, not_contains_any, starts_with; atoms on one leaf AND. Depth 5, 1..20 children a group, 20 leaves a subscription (group nodes are free). A missing path fails every atom but is_null, ne and nin included, so on a list of events a leaf on one event's field takes the scoped form or[not type in [...], leaf], two leaves. is_null, never eq null. A skipped event leaves no log row. 422 rules: filter_grammar_invalid names the node, filter_leaves_limit_exceeded past 20. null = no gate. Example: {\"and\": [{\"field\": \"payload.channel\", \"op\": {\"eq\": \"email\"}}]}"
          additionalProperties: false
          description: FULL replacement; null or {} clears the narrowing and the gate.
        status:
          type: string
          enum:
            - "on"
            - "off"
          description: on | off; failed is platform-set.
