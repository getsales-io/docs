    UpdateWebhookRequest:
      type: object
      description: Request body of `update_webhook`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New name, 1..255 chars.
        target_url:
          type: string
          maxLength: 2048
          description: https only, a public host; unique per team.
        events:
          type: array
          items:
            type: string
            enum:
              - data-sources.completed
              - data-sources.failed
              - data-sources.paused
              - data-sources.deleted
              - playtable-runs.finished
              - playtable-runs.cancelled
              - workflows.published
              - workflow-records.entered
              - workflow-records.completed
              - workflow-records.failed
              - workflow-records.exited
              - workflow-records.paused
              - workflow-records.resumed
              - messages.sent
              - messages.received
              - messages.bounced
              - conversations.created
              - conversations.state-changed
              - conversations.scenario-changed
              - conversations.merged
              - conversations.person-linked
              - conversations.person-unlinked
              - conversations.signals-changed
              - tasks.created
              - tasks.completed
