components:
  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by gs.service.id. Its `access_identity` claim carries `team_sid`, `actor_sid` and `actor_type`, and that team scope is authoritative.
    TeamSid:
      type: apiKey
      in: header
      name: Team-SID
      description: Team scope for tokens that do not carry one. Ignored when the token already names a team.
  responses:
    McpClientError:
      description: MCP error envelope. `error.code` is one of validation_failed, nothing_to_update, not_found, relation_not_found, invalid_transition, limit_exceeded, payment_required, duplicate_rejected, conflict, delete_blocked, unauthorized, forbidden, rate_limited, not_implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/McpError"
    McpServerError:
      description: MCP error envelope with `error.code` internal_error or service_unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/McpError"
  schemas:
    CancelWebhookLogRequest:
      type: object
      description: Request body of `cancel_webhook_log`.
      properties:
        expected_status:
          type: string
          enum:
            - pending
            - in_progress
            - retrying
            - success
            - failed
            - cancelled
          description: "Optional guard: the cancel only runs when the row still has this status."
    CancelWebhookLogResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - action
        action:
          type: string
          description: kebab-case verb; matches the route segment.
        item:
          type: object
          nullable: true
          properties:
            sid:
              type: string
              description: Delivery sid (wh_lg_...).
            team_sid:
              type: string
              description: The subscribing workspace (ts_tm_...).
            webhook_sid:
              type: string
              description: The parent subscription (wh_hk_...).
            account_sid:
              type: string
              nullable: true
              description: The sending identity the subscription matched on (ub_sp_...); null on a team-wide event.
            source_service:
              type: string
              nullable: true
              description: Which service produced the event (playtables, unibox, signals, integrations); observability only.
            event_type:
              type: string
              description: The event type (a WebhookEventTypeEnum value).
            event_source_sid:
              type: string
              nullable: true
              description: The row whose state change produced the event; null when none.
            status:
              type: string
              enum:
                - pending
                - in_progress
                - retrying
                - success
                - failed
                - cancelled
