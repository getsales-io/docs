components:
  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by gs.service.id. Its `access_identity` claim carries `team_sid`, `actor_sid` and `actor_type`, and that team scope is authoritative.
    TeamSid:
      type: apiKey
      in: header
      name: Team-SID
      description: Team scope for tokens that do not carry one. Ignored when the token already names a team.
  responses:
    McpClientError:
      description: MCP error envelope. `error.code` is one of validation_failed, nothing_to_update, not_found, relation_not_found, invalid_transition, limit_exceeded, payment_required, duplicate_rejected, conflict, delete_blocked, unauthorized, forbidden, rate_limited, not_implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/McpError"
    McpServerError:
      description: MCP error envelope with `error.code` internal_error or service_unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/McpError"
  schemas:
    CancelWebhookLogRequest:
      type: object
      description: Request body of `cancel_webhook_log`.
      properties:
        expected_status:
          type: string
          enum:
            - pending
            - in_progress
            - retrying
            - success
            - failed
            - cancelled
          description: "Optional guard: the cancel only runs when the row still has this status."
    CancelWebhookLogResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - action
        action:
          type: string
          description: kebab-case verb; matches the route segment.
        item:
          type: object
          nullable: true
          properties:
            sid:
              type: string
              description: Delivery sid (wh_lg_...).
            team_sid:
              type: string
              description: The subscribing workspace (ts_tm_...).
            webhook_sid:
              type: string
              description: The parent subscription (wh_hk_...).
            account_sid:
              type: string
              nullable: true
              description: The sender profile the event belongs to (ub_sp_...); null on an event of no sender profile.
            source_service:
              type: string
              nullable: true
              description: Which service forwarded the event (playtables, unibox, signals); null on webhooks.failed, which this plane writes itself; observability only.
            event_type:
              type: string
              description: The event type (a WebhookEventTypeEnum value).
            event_source_sid:
              type: string
              nullable: true
              description: The row whose state change produced the event; null when none.
            status:
              type: string
              enum:
                - pending
                - in_progress
                - retrying
                - success
                - failed
                - cancelled
              description: pending or retrying = waiting for the tick; in_progress = leased by a worker; success; failed (the ladder ran out, or a 4xx); cancelled.
            retry_count:
              type: integer
              description: Executed attempts, a success included (a first-try delivery reads 1); a manual re-arm does not move it.
            cancel_reason:
              type: string
              nullable: true
              enum:
                - manual
                - webhook_deleted
                - webhook_disabled
                - webhook_failed
              description: manual, or the cascade of a deleted, disabled or failed webhook; null unless cancelled.
            request_method:
              type: string
              enum:
                - POST
              description: POST.
            request_url:
              type: string
              description: "The target URL at insert: a retry replays it."
            request_headers:
              type: object
              additionalProperties:
                type: string
              description: The headers of the last attempt, X-Webhook-* and X-Trace-Id with them; empty before one ran and on a row older than 2026-11-04.
            request_payload:
              type: object
              properties:
                webhook_log_sid:
                  type: string
                  description: "This row's own sid: the receiver's dedup key."
                type:
                  type: string
                  description: The event type (a WebhookEventTypeEnum value).
                emitted_at:
                  type: string
                  description: ISO 8601 UTC of the state change.
                occurred_at:
                  type: string
                  nullable: true
                  description: Equal to emitted_at today, the object's own moment once a producer names one; absent on an envelope stored before 2026-11-03.
                team_sid:
                  type: string
                  description: The workspace (ts_tm_...).
                trace_id:
                  type: string
                  description: The trace of the write that produced the event.
                payload:
                  type: object
                  additionalProperties: {}
                  description: The event-specific payload.
              required:
                - webhook_log_sid
                - type
                - emitted_at
                - team_sid
                - trace_id
                - payload
              description: The stored envelope.
            response_code:
              type: integer
              nullable: true
              description: The receiver's status; null on a network error.
            error_message:
              type: string
              nullable: true
              description: The last attempt's error.
            duration_ms:
              type: integer
              nullable: true
              description: The last attempt's wall clock; null before one ran.
            scheduled_at:
              type: string
              description: ISO 8601 UTC when the next (or last) attempt is due.
            executed_at:
              type: string
              nullable: true
              description: ISO 8601 UTC of the last attempt, or of the cancel when the worker found the parent gone, off or failed; null before the worker took the row.
            created_at:
              type: string
              description: ISO 8601 UTC.
            updated_at:
              type: string
              description: ISO 8601 UTC.
          required:
            - sid
            - team_sid
            - webhook_sid
            - account_sid
            - source_service
            - event_type
            - event_source_sid
            - status
            - retry_count
            - cancel_reason
            - request_method
            - request_url
            - request_headers
            - request_payload
            - response_code
            - error_message
            - duration_ms
            - scheduled_at
            - executed_at
            - created_at
            - updated_at
        result:
          type: object
          properties:
            previous_status:
              type: string
              enum:
                - pending
                - in_progress
                - retrying
                - success
                - failed
                - cancelled
              description: The status before the cancel.
            cancel_reason:
              type: string
              enum:
                - manual
                - webhook_deleted
                - webhook_disabled
                - webhook_failed
              description: manual.
            cancelled_at:
              type: string
              nullable: true
              description: ISO 8601 UTC.
            in_flight_attempt_pending:
              type: boolean
              description: "true: a worker held the row; its attempt may still land as success."
          required:
            - previous_status
            - cancel_reason
            - cancelled_at
            - in_flight_attempt_pending
        meta:
          type: object
          properties:
            trace_id:
              type: string
              description: UUID v7; same 128-bit value as the X-Trace-Id header.
            span_id:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 16 hex chars, root span of this request.
            timestamp:
              type: string
              description: ISO 8601 UTC (Y-m-dTH:i:sZ), response time.
            duration_ms:
              type: integer
              minimum: 0
              description: Server-side wall clock.
            team_sid:
              type: string
              nullable: true
              description: The team this call ran in (the token team, or the team_sid override). Null when unauthenticated; absent from pre-2026-08-20 backends.
            actor_type:
              type: string
              nullable: true
              description: user | agent | api_key | system. Null when unauthenticated; absent from pre-2026-08-20 backends.
          required:
            - trace_id
            - span_id
            - timestamp
            - duration_ms
      required:
        - success
        - operation
        - action
        - item
        - result
        - meta
