  /api/webhooks/{sid}/test:
    post:
      operationId: test_webhook
      summary: Test webhook
      description: |-
        POST one signed synthetic envelope (type webhooks.test, or override_event_type) to the endpoint now and answer what came back: http_status, duration_ms, error_kind, error_message. sample_envelope dry-runs filters.where: filter_matched says if that event would be delivered. Writes no log row, moves no counter, fires no event. Allowed on a failed webhook (the revival check), refused on one switched off (409). Throttled 10 a minute per caller, together with replay_webhook.

        Contract:
        - MCP tool `test_webhook`, registry package `mcp.integrations/webhooks`, mount `workspace.webhooks`.
        - Operation `action`, response envelope `action`.
        - Flags: none.
      tags:
        - webhooks
      parameters:
        - name: sid
          in: path
          required: true
          description: Webhook sid (wh_hk_...).
          schema:
            type: string
            minLength: 18
            maxLength: 18
            pattern: ^wh_hk_
            description: Webhook sid (wh_hk_...).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWebhookRequest"
      responses:
        "200":
          description: "`action` success envelope."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestWebhookResponse"
        4XX:
          $ref: "#/components/responses/McpClientError"
        5XX:
          $ref: "#/components/responses/McpServerError"
