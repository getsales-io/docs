                    type: number
                    nullable: true
                    description: Credits per search (the vendor's fee with the margin) on top of the tokens; null when it cannot search.
                  web_search_overhead_tokens:
                    type: integer
                    nullable: true
                    description: The prompt tokens the vendor bills for declaring the search tool, searched or not; null when it cannot search.
                  web_search_max_uses:
                    type: integer
                    nullable: true
                    description: The searches one call may run at most; null when it cannot search.
                  price_with_web_search_min:
                    type: number
                    nullable: true
                    description: The triple of the same call with the search tool declared (its overhead billed searched or not).
                  price_with_web_search_expected:
                    type: number
                    nullable: true
                    description: As above, expected.
                  price_with_web_search_max:
                    type: number
                    nullable: true
                    description: As above, max.
                  default:
                    type: boolean
                    description: The one default model of an llm operation (model auto resolves to it).
                  dimensions:
                    type: integer
                    nullable: true
                    description: "llm.embed: the pinned vector size (1024); null elsewhere."
                required:
                  - operation
                  - provider
                  - model
                  - name
                  - description
                  - platform_key
                  - pricing_unit
                  - price_min
                  - price_expected
                  - price_max
                  - credits_per_mtok_input
                  - credits_per_mtok_output
                  - max_tokens
                  - cacheable
                  - web_search
