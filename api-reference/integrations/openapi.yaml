              type: string
              nullable: true
              description: "The model on an llm or audio call: the price axis; null elsewhere."
            custom_tool_sid:
              type: string
              nullable: true
              description: The custom tool of an http.request (in_tl_...); null elsewhere.
            provider_connection_sid:
              type: string
              nullable: true
              description: The team grant of a crm call or the tool's connection; null = the platform key.
            status:
              type: string
              enum:
                - pending
                - in_progress
                - success
                - failed
                - retrying
                - cancelled
              description: success | failed for a finished call; pending = an http.request claimed and never finalized (outcome unknown).
            http_code:
              type: integer
              nullable: true
              description: The provider's answer; null on a network error or timeout.
            duration_ms:
              type: integer
              nullable: true
              description: Wall clock of the attempt.
            error_code:
              type: string
              nullable: true
              enum:
                - auth_error
                - rate_limited
                - timeout
                - network_error
                - invalid_input
                - provider_error
                - not_found
              description: The classified failure; not_found = an operation-level miss (no email exists); null on success.
            error_message:
              type: string
              nullable: true
              description: A tenant-readable rendering; the raw body is in response.
            request:
              type: object
              nullable: true
              additionalProperties: {}
              description: The sanitized provider request (no auth material); capped at 64 KB; null on search rows.
            response:
              type: object
              nullable: true
              additionalProperties: {}
              description: The raw provider body, truncated to 16 KB; null on search rows.
            output:
              type: object
              nullable: true
              additionalProperties: {}
              description: The normalized result the caller received; null on search rows.
            prompt_tokens:
              type: integer
              nullable: true
              description: llm calls only.
            completion_tokens:
              type: integer
              nullable: true
              description: llm calls only.
            total_tokens:
              type: integer
              nullable: true
              description: llm calls only.
            cache_hit:
              type: boolean
              description: true = answered from the cross-team result cache, no round-trip, 0 credits.
            credits_charged:
              anyOf:
                - type: number
                - type: string
              description: Credits priced at call time (a decimal); 0 on a failure, a cache hit, a bundled call.
            billing:
              type: string
              nullable: true
              enum:
                - standard
                - bundled
                - caller
              description: standard = the catalog rate, held and settled on the team wallet by the platform (the billing bus, 2026-10-22); bundled = folded into a charge the caller already made (0); caller = the caller meters it against the wallet itself under the same key (the email finder and verifier of a waterfall); null on rows before the column.
            idempotency_key:
              type: string
              description: The caller's end-to-end dedup key; a replay returns the stored outcome.
            created_at:
              type: string
              description: "ISO 8601 UTC: the metrics period column."
            updated_at:
              type: string
              description: ISO 8601 UTC.
