      summary: Replay webhook deliveries
      description: |-
        Put the deliveries a broken endpoint left behind back on the wire: every row of this webhook created inside [from, to] whose status is in statuses (default failed and cancelled; success re-fires delivered events, opt-in) goes back to pending, oldest first, scheduled_at one second apart, and the minute tick sends what is due: the stored envelope to the URL stored on the row (a changed target_url is not followed), under the same webhook_log_sid, so the receiver's dedup holds. A cancelled row comes back only when the platform cancelled it, never after a manual cancel (the app's Retry on the row takes that one); rows in flight are never touched; an event emitted while the webhook was off or failed has no row and cannot come back. retry_count stays, so a row that spent its 5 attempts gets one more. from is required; the window spans at most 30 days (422, rule replay_window_too_wide) and one call re-arms at most 5000 rows (429 limit_exceeded): past either nothing is re-armed, narrow from, to, statuses or event_types and call again. Needs status on (409 invalid_transition otherwise): revive a failed webhook with update_webhook first. Throttled 10 a minute per caller, together with test_webhook. Re-delivers real events to the integrator.

        Contract:
        - MCP tool `replay_webhook`, registry package `mcp.integrations/webhooks`, mount `workspace.webhooks`.
        - Operation `action`, response envelope `action`.
        - Flags: dangerous: the MCP layer gates it behind a preview/commit token, and the effect cannot be undone through this API.
