              type: string
              enum:
                - llm.generate
                - llm.embed
                - email.find
                - email.verify
                - http.request
                - crm.contact_upsert
                - crm.company_upsert
                - crm.associate
                - crm.properties_list
                - serp.search
                - audio.transcribe
              description: What was called.
            provider:
              type: string
              enum:
                - openai
                - anthropic
                - google
                - deepseek
                - xai
                - voyage
                - cohere
