  /api/provider-connections:
    post:
      operationId: create_provider_connection
      summary: Create provider connection
      description: |-
        Store a team credential. provider custom: the team's OWN API, name, auth_type (api_key or bearer inject Authorization Bearer; basic; header; query) and the write-only auth payload, never echoed; unverified at create (test_provider_connection probes it). provider attio or folk, a CRM connected by a pasted key: auth is {key}, auth_type bearer (the default), and the key is identified LIVE before anything is written (Attio GET /v2/self; folk GET /v1/users/me). A dead or inactive key is 422 api_key_rejected on auth.key; an Attio key without a CORE scope (record_permission:read-write, object_configuration:read) is 422 api_key_scopes_missing, the names in the message; the CRM unreachable is 409 attio_connect_unconfirmed or folk_connect_unconfirmed, nothing written. The account lands as external_account_id, so a key of an account already held ROTATES that row: already_exists true, result.reconnected true, same sid, counter cleared, a failed row revived. name defaults to the account (Attio {workspace}, folk {member email}); result carries account_name and missing_scopes (Attio's OPTIONAL list and note scopes: a warning, never a refusal). Refused: a vendor (422 provider_not_connectable: the platform holds those keys) and an OAuth CRM (422 auth_type_invalid_for_provider: start_provider_connection_oauth). 409 on a duplicate name.

