              type: string
              description: ISO 8601 UTC when the delivery was due.
            delivered_at:
              type: string
              nullable: true
              description: ISO 8601 UTC; null until delivered.
            read_at:
              type: string
              nullable: true
              description: ISO 8601 UTC when the recipient read an in_app row; null = unread, and always null on an email.
            failed_at:
              type: string
              nullable: true
              description: ISO 8601 UTC; null unless failed.
            failure_reason:
