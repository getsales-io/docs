                  type: string
                  description: The price book version the figures came from.
                lines:
                  type: array
                  items:
                    type: object
                    additionalProperties: {}
                  description: "One per resource ordered: line (linkedin | email | data), its count or packages, capacity, rate_minor, monthly_minor and invoice_minor (the amount per billing period)."
                monthly_minor:
                  type: integer
                  description: The recurring lines a month, before 12 + 2.
                recurring_invoice_minor:
                  type: integer
                  description: "The recurring invoice: the monthly sum, times 12 on annual."
                one_time_minor:
                  type: integer
                  description: The one-time credits line, paid once.
                due_now_minor:
                  type: integer
                  description: "The first payment before tax and coupons: the recurring invoice plus the one-time line."
                has_recurring:
                  type: boolean
                  description: false = one-time credits alone, which make no subscription.
                service_months:
                  type: integer
                  nullable: true
                  description: 1, or 14 for 12 + 2; null when nothing recurs.
                grant_count:
                  type: integer
                  description: How many monthly credit grants the period pays for (1, or 14).
                credit_expiry_days:
                  type: integer
                  nullable: true
                  description: "Days a granted lot lives: null = the credits live with the plan and burn when the workspace leaves it (an order that buys a plan, or credits bought alone under one); 90 for credits bought alone with no paid plan."
                capacity:
