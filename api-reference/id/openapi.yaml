                service:
                  type: object
                  additionalProperties: {}
                  description: level (free | paid | business | enterprise), next_level, next_threshold_minor and gap_minor a month to it; White label is part of Business.
                linkedin_next_tier:
                  type: object
                  nullable: true
                  additionalProperties: {}
