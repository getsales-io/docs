        Write the workspace profile: a section given (company, who_buys, offer) replaces that section whole, so read it first and send it back with the fields changed; source stamps every field of the sections given (website, linkedin_company, linkedin_profile, person for the person's own words, creator for an inference; default person); confirm true marks the profile confirmed. The first write creates the row. 422 unknown_field on a key outside a section's shape, website_invalid, ln_nickname_invalid.

        Contract:
        - MCP tool `update_workspace_profile`, registry package `mcp.id/workspace_profiles`, mount `id.identity`.
        - Operation `update`, response envelope `update`.
        - Flags: none.
      tags:
        - workspace_profiles
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceProfileRequest"
      responses:
        "200":
          description: "`update` success envelope."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateWorkspaceProfileResponse"
        4XX:
          $ref: "#/components/responses/McpClientError"
        5XX:
          $ref: "#/components/responses/McpServerError"
      x-gs-mcp-tool: update_workspace_profile
      x-gs-mcp-mount: id.identity
      x-gs-entity: workspace_profiles
      x-gs-operation: update
      x-gs-envelope: update
      x-gs-availability: ga
