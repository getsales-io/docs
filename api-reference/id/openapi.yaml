    VerifyWhitelabelEmailDomainResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - action
        action:
          type: string
        async:
          type: boolean
          enum:
            - true
        item:
          type: object
          nullable: true
          properties:
            sid:
              type: string
              description: Brand sid (id_wl_...).
            team_sid:
              type: string
              description: The owning reseller team (ts_tm_...).
            name:
              type: string
              description: The brand name the app shell shows and the mail is signed with.
            domain:
              type: string
              description: The app and login host (app.reseller.com), lowercase FQDN, unique platform-wide; read-only once active.
            status:
              type: string
              enum:
                - pending_domain
                - active
                - disabled
              description: pending_domain = waiting for the CNAME and the certificate; active = the host serves the brand; disabled = switched off, the host falls back to the platform brand.
            logo_url:
              type: string
              nullable: true
              description: The horizontal logo (app shell and email header).
            icon_url:
              type: string
              nullable: true
              description: The square mark or favicon.
            login_image_url:
              type: string
              nullable: true
              description: The login page artwork.
            palette:
              type: object
              nullable: true
              properties:
                primary_color:
                  type: string
                  nullable: true
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: "Buttons and links, #rrggbb; null = the platform default."
                accent_color:
                  type: string
                  nullable: true
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: "The accent, #rrggbb; null = the platform default."
                login_background_color:
                  type: string
                  nullable: true
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: "The login page background, #rrggbb; null = the platform default."
              description: Brand colors; null = all platform defaults.
            email_from_name:
              type: string
              nullable: true
              description: The From name on the clients' mail; null = the brand name.
            email_reply_to:
              type: string
              nullable: true
              description: The Reply-To on the clients' mail; null = none.
            email_from_address:
              type: string
              nullable: true
              description: The brand's own sender address; mail leaves from it once email_domain is verified, from the platform address under the brand's name until then.
            email_domain:
              type: object
              nullable: true
              properties:
                domain:
                  type: string
                  description: "The domain part of email_from_address, lowercase: what SendGrid authenticates."
                status:
                  type: string
                  enum:
                    - pending
                    - verified
                    - failed
                  description: pending = records not all found yet; verified = the brand's mail leaves from its own address; failed = see failure_reason.
                records:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: "cname (three of them: the return path and two DKIM keys)."
                      host:
                        type: string
                        description: The record name to publish at the domain's DNS host.
                      value:
                        type: string
                        description: The CNAME target at SendGrid.
                      valid:
                        type: boolean
                        description: What the last check found for this record.
                    required:
                      - type
                      - host
                      - value
                      - valid
                  description: The DNS records to publish, in the order SendGrid issued them.
                failure_reason:
                  type: string
                  nullable: true
                  enum:
                    - email_domain_rejected
                    - email_domain_not_proven_in_time
                  description: email_domain_rejected (SendGrid refused the domain) or email_domain_not_proven_in_time (48 hours lapsed); null unless failed.
                checked_at:
                  type: string
                  nullable: true
                  description: ISO 8601 UTC of the last check against SendGrid.
                verified_at:
                  type: string
                  nullable: true
                  description: ISO 8601 UTC since when it is verified; null while it is not.
              required:
                - domain
                - status
                - records
                - failure_reason
                - checked_at
                - verified_at
              description: The proof of the sending domain; null = verify never ran, or the address moved to another domain.
            created_by:
              type: object
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                actor_name:
                  type: string
                  nullable: true
                  description: The OAuth client that acted ("Claude", "n8n"); null for a user, an API key or a system job.
                oauth_client_sid:
                  type: string
                  nullable: true
                  description: The acting OAuth client (id_oc_*); null off the OAuth path.
                reason:
                  type: string
                  nullable: true
                  description: Why a system actor wrote the row (snapshot_capture_job, ...); null otherwise.
                permissions:
                  type: object
                  additionalProperties: {}
                  description: "Internal audit context: the grant set the actor held at write time. Not a contract."
                cluster_id:
                  type: integer
                  nullable: true
                  description: "Internal audit context: the cluster that served the write."
                trace_id:
                  type: string
                  nullable: true
                  description: "Internal audit context: the trace id of the request that wrote the row."
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
              description: Who registered the brand.
            created_at:
              type: string
              description: ISO 8601 UTC.
            updated_at:
              type: string
              description: ISO 8601 UTC.
            deleted_at:
              type: string
              nullable: true
              description: ISO 8601 UTC; null = live.
          required:
            - sid
            - team_sid
            - name
            - domain
            - status
            - logo_url
            - icon_url
            - login_image_url
            - palette
            - email_from_name
            - email_reply_to
            - email_from_address
            - email_domain
            - created_by
            - created_at
            - updated_at
            - deleted_at
        pending:
