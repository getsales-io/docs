      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - action
        action:
          type: string
        async:
          type: boolean
          enum:
            - true
        item:
          type: object
          nullable: true
          properties:
            sid:
              type: string
              description: Certificate sid (id_sc_...).
            team_sid:
              type: string
              description: The reseller team (ts_tm_...).
            domain:
              type: string
              description: The brand's host, lowercase FQDN.
            status:
              type: string
              enum:
                - pending
                - challenge
                - active
                - failed
                - expired
              description: pending = registered; challenge = a first issuance in flight; active = serving; failed; expired. A renewal of an active row keeps active.
            challenge:
              type: object
              nullable: true
              properties:
                type:
                  type: string
                  enum:
                    - http-01
                  description: The one challenge type served.
                token:
                  type: string
                  description: The ACME token the platform serves at well_known_path.
                key_authorization:
                  type: string
                  description: The key authorization the CA expects there.
                well_known_path:
                  type: string
                  description: The path the CA fetches on the domain.
                cname_target:
                  type: string
                  description: The platform host the domain's CNAME must point at.
                expires_at:
                  type: string
                  nullable: true
                  description: ISO 8601 UTC when the authorization lapses at the CA.
              required:
                - type
                - token
                - key_authorization
                - well_known_path
                - cname_target
                - expires_at
              description: The attempt in flight (first issuance or renewal); null when none.
            issuer:
              type: string
              nullable: true
              description: The CA that issued the serving certificate; null until one did.
            issued_at:
              type: string
              nullable: true
              description: ISO 8601 UTC; null until issued.
            expires_at:
              type: string
              nullable: true
              description: ISO 8601 UTC the serving certificate lapses; renewed 30 days ahead.
            last_error:
              type: string
              nullable: true
              description: "Why the last attempt failed, as a token: domain_not_pointed (fix the CNAME), domain_validation_failed (CAA or other DNS), issuance_unavailable (our side or the CA, contact support). null = none."
            created_by:
              type: object
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                actor_name:
                  type: string
                  nullable: true
                  description: The OAuth client that acted ("Claude", "n8n"); null for a user, an API key or a system job.
                oauth_client_sid:
                  type: string
                  nullable: true
                  description: The acting OAuth client (id_oc_*); null off the OAuth path.
                reason:
                  type: string
                  nullable: true
                  description: Why a system actor wrote the row (snapshot_capture_job, ...); null otherwise.
                permissions:
                  type: object
                  additionalProperties: {}
                  description: "Internal audit context: the grant set the actor held at write time. Not a contract."
                cluster_id:
                  type: integer
                  nullable: true
                  description: "Internal audit context: the cluster that served the write."
                trace_id:
                  type: string
                  nullable: true
                  description: "Internal audit context: the trace id of the request that wrote the row."
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
              description: Who registered the domain (the brand's activation).
            created_at:
              type: string
              description: ISO 8601 UTC.
            updated_at:
              type: string
              description: ISO 8601 UTC.
            deleted_at:
              type: string
              nullable: true
              description: ISO 8601 UTC; null = live.
          required:
            - sid
            - team_sid
            - domain
            - status
            - challenge
            - issuer
            - issued_at
            - expires_at
            - last_error
            - created_by
            - created_at
            - updated_at
            - deleted_at
        pending:
          type: array
          items:
            type: object
            properties:
              expected_completion_seconds:
                type: integer
                description: "120: the self-check, the validation and the finalize once the domain resolves."
              webhook_events:
                type: array
                items:
                  type: string
                description: "issue: ssl-certificates.issued, ssl-certificates.failed; renew: ssl-certificates.renewed, ssl-certificates.renewal-failed, ssl-certificates.failed."
