                    - tablet
                    - unknown
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - desktop
                      - mobile
                      - tablet
                      - unknown
              additionalProperties: false
              description: desktop | mobile | tablet | unknown.
            browser:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: As the parser names it (Chrome, Safari...).
            os:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: As the parser names it (Windows, macOS, iOS...).
            is_internal:
              type: object
              properties:
                eq:
                  type: boolean
              additionalProperties: false
              description: "The team's own traffic (the site's ignored_ips, an email of its own domains). No default scope: internal visits are shown unless this says otherwise."
            started_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
              additionalProperties: false
              description: 'ISO 8601 bounds: the period ("this week" is gte seven days ago). Combine bounds in one object.'
            closed_at:
              type: object
