    SearchWebsiteSessionOwnersResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - search
        items:
          type: array
          items:
            type: object
            properties:
              item:
                type: object
                properties:
                  owner_type:
                    type: string
                    enum:
                      - person
                      - company
                      - visitor
                    description: "person: a rung of the ladder named someone; company: only a company code in our link or the visitor's network named one; visitor: nobody is named for the browser yet."
                  owner_sid:
                    type: string
                    description: "cr_pp_... (person, playtables), cr_co_... (company, playtables) or sg_wv_... (visitor): the row's key."
                  latest:
                    type: object
                    properties:
                      sid:
                        type: string
                        description: Website session sid (sg_ws_...).
                      team_sid:
                        type: string
                        description: "Owning team (ts_tm_..., external: gs.service.id)."
                      site_sid:
                        type: string
                        description: The registered site (sg_si_...).
                      visitor_sid:
                        type: string
                        description: The browser behind the visit (sg_wv_...); a person may own several.
                      person_sid:
                        type: string
                        nullable: true
                        description: The person a rung named (cr_pp_..., playtables); null while nobody did. A person always takes a session over from a company.
                      company_sid:
                        type: string
                        nullable: true
                        description: The company a company code in our link or the network named when no person did (cr_co_..., playtables); cleared when a person takes the session over.
                      attribution:
                        type: string
                        enum:
                          - code
                          - identified
                          - fingerprint
                          - manual
                          - company_code
                          - company_network
                          - none
                        description: "Which rung named the owner: code (the person code in our link), identified (an identify or a form), fingerprint (the device), manual (a bind by hand), company_code (the company code in our link: the company, never a person; every code on a site set to companies), company_network (the network, a company); none while nothing did."
                      fingerprint_sid:
                        type: string
                        nullable: true
                        description: The device the fingerprint base saw the session from (sg_fp_...); null when none was stored.
                      started_at:
                        type: string
                        description: ISO 8601 UTC, the receipt time of the first hit. The feed's order, newest first.
                      last_seen_at:
                        type: string
                        description: ISO 8601 UTC, the receipt time of the newest hit; the row grows until the close.
