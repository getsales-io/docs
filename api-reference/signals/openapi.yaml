            fingerprint_sid:
              type: string
              nullable: true
              description: The device the fingerprint base saw the session from (sg_fp_...); null when none was stored.
            started_at:
              type: string
              description: ISO 8601 UTC, the receipt time of the first hit. The feed's order, newest first.
            last_seen_at:
              type: string
              description: ISO 8601 UTC, the receipt time of the newest hit; the row grows until the close.
            closed_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, set by the sweep 30 minutes after last_seen_at; null = the visitor may still be on the site.
            pageviews_count:
              type: integer
              minimum: 0
              description: Every page view, beyond the cap of pages too.
            engaged_seconds:
              type: integer
              minimum: 0
              description: The sum over page views of the largest engaged time each reported.
            entry_path:
              type: string
              description: The path of the first page view, with its query.
            exit_path:
              type: string
              description: The path of the last page view.
            pages:
              type: array
              items:
                type: object
                properties:
                  page_id:
                    type: string
                    description: The page view's id from the wire (12 characters).
                  path:
                    type: string
                    description: The page's path with its query, the code in our link removed by the script.
                  title:
                    type: string
                    nullable: true
                    description: The document title; null when none.
                  engaged_seconds:
                    type: integer
                    minimum: 0
                    description: The largest engaged time a ping of this page view reported, in whole seconds.
                  first_seen_at:
                    type: string
                    description: ISO 8601 UTC, the receipt time of the pageview hit.
                  scroll_pct:
                    type: integer
                    nullable: true
                    minimum: 0
                    maximum: 100
                    description: The deepest scroll a ping of this page view reported, 0 to 100; null until one did (and on visits folded before 2026-10-07).
                required:
                  - page_id
                  - path
                  - title
                  - engaged_seconds
                  - first_seen_at
                  - scroll_pct
              description: The first 50 page views, in order, each with its engaged time.
            events:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - event
                      - form
                    description: "event: a custom event the site sent; form: a form it reported (a marked form's submit, or a form a server-side identify named)."
                  name:
                    type: string
                    description: The event's name or the form's name as the site sent it. A form's email never rides here.
                  at:
                    type: string
                    description: ISO 8601 UTC, the receipt time of the hit.
                  page_id:
                    type: string
                    description: The page view the hit belonged to.
                required:
                  - kind
                  - name
                  - at
                  - page_id
              description: The first 50 custom events and forms, in order; every event the site sent, registered or not.
            key_pages:
              type: array
              items:
                type: string
              description: "The keys (slugs) of the site's key pages reached, in the order first reached: what the key_page filter matches and the signal visited_key_page reads."
            referrer_type:
              type: string
              enum:
                - direct
                - internal
                - search
                - social
                - email
                - ads
                - referral
                - ai_assistant
                - unknown
              description: "Where the visit came from, decided on the first page view: direct, internal (another page of the site), search, social, email, ads (a click id or a paid utm_medium), referral, ai_assistant (ChatGPT, Perplexity, Claude and the like), unknown."
            referrer_host:
              type: string
              nullable: true
              description: The referrer's host, lowercased, no www.; null when absent or unreadable.
            utm_source:
              type: string
              nullable: true
            utm_medium:
              type: string
              nullable: true
            utm_campaign:
              type: string
              nullable: true
            utm_content:
              type: string
              nullable: true
            utm_term:
              type: string
              nullable: true
            landing_code:
              type: string
              nullable: true
              description: The first code a hit of the session carried (the person code or the company code in the link we sent); null when none.
            browser:
              type: string
              nullable: true
              description: The parser's name (Chrome, Safari, Firefox...); null when unknown.
            browser_version:
              type: string
              nullable: true
            os:
              type: string
              nullable: true
              description: Windows, macOS, iOS, Android, Linux...; null when unknown.
            os_version:
              type: string
              nullable: true
            device:
              type: string
              enum:
                - desktop
                - mobile
                - tablet
                - unknown
              description: desktop | mobile | tablet | unknown.
            screen:
              type: string
              nullable: true
              description: "{width}x{height} of the screen; null when the first page view did not report it."
            language:
              type: string
              nullable: true
              description: The browser's first language; null when not reported.
            timezone:
              type: string
              nullable: true
              description: The browser's IANA zone; null when not reported.
            geo_country:
              type: string
              nullable: true
              description: ISO 3166-1 alpha-2 from the edge's location header; null when the edge gave none.
            geo_region:
              type: string
              nullable: true
            geo_city:
              type: string
              nullable: true
            ip:
              type: string
              description: The client address of the first hit (IPv4 or IPv6); its network part only once the network answer is stored on a site with anonymize_ip.
            network_status:
              type: string
              enum:
                - pending
                - resolved
                - failed
                - private
              description: pending until the data service answered for the address; resolved with the network columns filled; failed (no answer after the asks); private (an address nobody is asked about).
            network_type:
              type: string
              nullable: true
              description: "The data service's classification of the block: business, isp, mobile, hosting, education, government or unknown; null until resolved."
            network_name:
              type: string
              nullable: true
              description: The organization the block is registered to, else the registry's name of the block ("Deutsche Telekom", "Hetzner"); null until resolved.
            network_domain:
              type: string
              nullable: true
              description: The company domain the data service derived for a business network; null when none.
            asn:
              type: integer
              nullable: true
              description: The origin AS; null until resolved.
            as_name:
              type: string
              nullable: true
              description: The AS holder; null until resolved.
            is_internal:
              type: boolean
              description: "A hit came from one of the site's ignored_ips, or an identified email of the team's own domains: the team's own traffic, never a fact, never a signal."
            created_at:
              type: string
              description: ISO 8601 UTC.
            updated_at:
              type: string
              description: ISO 8601 UTC.
          required:
            - sid
            - team_sid
            - site_sid
            - visitor_sid
            - person_sid
            - company_sid
            - attribution
            - fingerprint_sid
            - started_at
            - last_seen_at
