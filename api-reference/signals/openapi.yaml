      type: object
      description: Request body of `mark_signals_seen`.
      properties:
        seen_at:
          type: string
          nullable: true
          description: "ISO 8601 (an offset is read): the instant the feed was read. Absent or null = now. Cut to the second, capped at now plus one minute, and never moves seen_at back."
    MarkSignalsSeenResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - action
        action:
          type: string
          description: kebab-case verb; matches the route segment.
        item:
          type: object
          nullable: true
          properties:
            sid:
              type: string
              description: Signal preference sid (sg_up_...).
            team_sid:
              type: string
              description: "Owning team (ts_tm_..., external: gs.service.id)."
            user_sid:
              type: string
              description: "The member the row belongs to: the caller's actor sid (an agent acting for a member is the member; an api key has a row of its own). Exactly one row per team and user."
            hidden_types:
              type: array
              items:
                type: string
              description: Signal types (SignalFeedType) the feed leaves out, as a set in the page's order. Default ["email_bounced"]. Hiding is opt-out, so a type added to the list later shows at once. The shown types are every SignalFeedType not in this list.
            notify_types:
              type: array
              items:
                type: string
              description: "Signal types the user is told about (the badge on the Signals menu entry counts the ones that are also shown, and each raises a toast while the user works elsewhere), as a set in the page's order. Default: website_key_page_visited, website_form_submitted, linkedin_connection_request_accepted, linkedin_message_replied, linkedin_inmail_replied, linkedin_invitation_received, email_replied. Opt-in, so a type added later tells nobody until chosen."
            sender_profile_scope:
              type: string
              enum:
                - all
                - mine
                - chosen
              description: "Whose sender profiles the feed's sender profile filter starts on: all (default, no sender profile filter), mine (the user's own sender profiles) or chosen (sender_profile_sids). A default of the filter and nothing more."
            sender_profile_sids:
              type: array
              items:
                type: string
              description: "The chosen sender profiles (unibox sender profile sids, ub_sp_...), at most 200, read when sender_profile_scope is chosen (chosen with [] is every sender profile: no sender profile filter) and kept when it moves off it, so moving back restores the picks. [] by default."
            toast_enabled:
              type: boolean
              description: Whether a notify type raises a toast. Default true.
            seen_at:
              type: string
              description: "ISO 8601 UTC, whole seconds: up to when the user has seen the feed. A fact is new when it reached the ledger after this (created_at > seen_at in search_activities). Born a day before the row, so a first visit shows the last day as new; moved forward by mark_signals_seen only, never back."
            saved_views:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: 10 base62 characters, minted by the server for an item sent without one and kept across writes.
                  name:
                    type: string
                    description: 1..60 characters.
                  view:
                    type: string
                    enum:
                      - needs_me
                      - all
                      - posts
                      - moments
                      - website
                      - linkedin
                      - email
                    description: "all | website | linkedin | email: the view the saved view opens on."
                  filter:
                    type: object
                    properties:
                      object_type:
                        type: string
                        nullable: true
                        enum:
                          - person
                          - company
                        description: "person | company: the All / People / Companies switch; null = both."
                      playtable_sid:
                        type: string
                        nullable: true
                        description: The table (pt_tb_...); null = every table.
                      sender_profile_sids:
                        type: array
                        items:
                          type: string
                        description: The sender profiles (unibox sender profile sids, ub_sp_...); [] = not filtered.
                      types:
                        type: array
                        items:
                          type: string
                        description: "The quick filter: signal types (SignalFeedType) in the page's order; [] = every shown type of the view."
                      q:
                        type: string
                        nullable: true
                        description: The name search, up to 128 characters; null = none.
                    required:
                      - object_type
                      - playtable_sid
                      - sender_profile_sids
                      - types
                      - q
