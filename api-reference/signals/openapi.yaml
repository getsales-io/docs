                - "off"
              description: "on (default): the device fingerprint is collected (answered as consent when consent_mode is required); consent: only after consent; off: never."
            anonymize_ip:
              type: boolean
              description: Once a session's network is resolved, keep the address's network part only (the last octet, or the last 80 bits of IPv6, zeroed). Default false.
            ignored_ips:
              type: array
              items:
                type: string
              description: "IPv4 or IPv6 addresses or CIDR ranges whose visits are internal (the office, the VPN egress): shown under their own filter, never a fact, never a signal. At most 50."
            live_alerts:
              type: string
