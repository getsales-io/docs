              description: Website site sid (sg_si_...).
            team_sid:
              type: string
              description: "Owning team (ts_tm_..., external: gs.service.id)."
            domain:
              type: string
              description: "The host as the team typed it, reduced to a bare hostname: lowercased, no scheme, port or path, a leading www. dropped. Immutable: a different host is a different site."
            include_subdomains:
              type: boolean
              description: Hosts under domain belong to the site (default true).
            site_key:
              type: string
              description: The public 20-character key the loader carries (gs.k). It names the site to the collector; not a secret. Changes only through rotate_website_site_key.
            status:
              type: string
              enum:
                - pending
                - verified
                - broken
                - disabled
              description: pending = waiting for the script (links to it are not coded yet); verified = receiving; broken = the health rule flagged it (see broken_reason); disabled = switched off by update enabled false.
            verified_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, the last transition into verified; null never.
            last_check_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, the last active check (verify_website_site or the daily job); null never.
            last_check_result:
              type: object
              nullable: true
              properties:
                outcome:
                  type: string
                  enum:
                    - found
                    - site_key_mismatch
                    - loader_missing
                    - fetch_failed
                  description: "The best outcome over pages: found wins over site_key_mismatch, over loader_missing, over fetch_failed."
                pages:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        description: The URL requested last for this page.
                      key_page_sid:
                        type: string
                        nullable: true
                        description: sg_kp_... the key page this row checked; null for the home page.
                      outcome:
                        type: string
                        enum:
                          - found
                          - site_key_mismatch
                          - loader_missing
                          - fetch_failed
                        description: "found: the page carries this site's key. site_key_mismatch: a loader with another key. loader_missing: no loader in the page source (a tag manager installs it outside the source, so such a site is verified by its first hit instead). fetch_failed: no page to read, see failure."
                      http_status:
                        type: integer
                        nullable: true
                        description: The final HTTP status; null when no answer arrived.
                      failure:
                        type: string
                        nullable: true
                        enum:
                          - invalid_url
                          - scheme_not_allowed
                          - credentials_in_url
                          - port_not_allowed
                          - ip_literal
                          - host_unresolvable
                          - private_address
                          - redirect_without_location
                          - too_many_redirects
                          - redirected_off_site
                          - connection_failed
                          - http_status
                        description: "Why the fetch failed, when outcome is fetch_failed: the guard refused the URL (scheme, port, credentials, an IP literal, a private address), the host did not resolve, the redirects ran out or left the site, the connection failed, or the status was outside 2xx. Null otherwise."
                    required:
                      - url
                      - key_page_sid
                      - outcome
                      - http_status
                      - failure
                  description: The home page first, then the checkable key pages (a pattern that names one URL).
              required:
                - outcome
                - pages
              description: What the last active check found, page by page; null while no check ran, and cleared by a key rotation.
            broken_reason:
              type: string
              nullable: true
              enum:
                - loader_missing
                - fetch_failed
                - site_key_mismatch
                - no_hits
              description: "Set while broken: loader_missing (the source lost the loader and the hits stopped), fetch_failed (two checks in a row could not read the site while it was silent), site_key_mismatch (another key in the loader), no_hits (a tag-manager install whose hits stopped). Null otherwise."
            last_hit_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, the newest hit the collector reported; null while nothing was received.
            hits_count_24h:
              type: integer
              minimum: 0
              description: Hits in the current UTC hour and the 23 before it, refreshed on every hit batch and every check (a rolling window, not "today").
            identification:
              type: string
              enum:
                - companies
                - people
              description: "What a visit to the site may name. companies (default): links carry the recipient's company code and a visit shows the company, never a person. people: visits from the people the team writes to are shown by name."
            identification_confirmation:
              type: object
              nullable: true
              properties:
                identification:
                  type: string
                  enum:
                    - companies
                    - people
                  description: "The level confirmed: people covers both levels, companies only itself."
                confirmed_at:
                  type: string
                  description: ISO 8601 UTC.
                confirmed_by:
                  type: object
                  properties:
                    actor_type:
                      type: string
                      enum:
                        - user
                        - support
                        - api_key
                        - system
                        - agent
                    actor_sid:
                      type: string
                      nullable: true
                    team_sid:
                      type: string
                    actor_name:
                      type: string
                      nullable: true
                      description: The OAuth client that acted ("Claude", "n8n"); null for a user, an API key or a system job.
                    oauth_client_sid:
                      type: string
                      nullable: true
                      description: The acting OAuth client (id_oc_*); null off the OAuth path.
                    reason:
                      type: string
                      nullable: true
                      description: Why a system actor wrote the row (snapshot_capture_job, ...); null otherwise.
                    permissions:
                      type: object
                      additionalProperties: {}
                      description: "Internal audit context: the grant set the actor held at write time. Not a contract."
                    cluster_id:
                      type: integer
                      nullable: true
                      description: "Internal audit context: the cluster that served the write."
                    trace_id:
                      type: string
                      nullable: true
                      description: "Internal audit context: the trace id of the request that wrote the row."
                  required:
                    - actor_type
                    - actor_sid
                    - team_sid
                    - permissions
                  description: Who confirmed.
              required:
                - identification
                - confirmed_at
                - confirmed_by
              description: The customer's latest confirmation of its duties for a level, by whom and when. Links are coded only while it covers the site's level; null = none yet.
            link_codes_enabled:
              type: boolean
              description: Links to this site get a code (the company's or the person's, by identification) when the site is verified, identification_confirmation covers its level and the team switch (signal_settings.website_link_codes) is on. Default true.
            carrier_linkedin:
              type: string
              enum:
                - fragment
                - query
              description: "Where the code rides in a link sent on LinkedIn: fragment (#g_<code>, default) or query (?gs=<code>)."
            carrier_email:
              type: string
              enum:
                - fragment
                - query
              description: "Where the code rides in a link sent by email: query (default) or fragment."
            consent_mode:
              type: string
              enum:
                - not_required
                - required
              description: "not_required (default): the first-party visitor id is stored on the first hit. required: nothing is stored until the site's banner calls gs('consent', true); until then a visit is attributed by the code in the link alone."
            fingerprint_mode:
              type: string
              enum:
                - "on"
                - consent
                - "off"
              description: "on (default): the device fingerprint is collected (answered as consent when consent_mode is required); consent: only after consent; off: never."
            anonymize_ip:
              type: boolean
              description: Once a session's network is resolved, keep the address's network part only (the last octet, or the last 80 bits of IPv6, zeroed). Default false.
            ignored_ips:
              type: array
              items:
                type: string
              description: "IPv4 or IPv6 addresses or CIDR ranges whose visits are internal (the office, the VPN egress): shown under their own filter, never a fact, never a signal. At most 50."
            live_alerts:
              type: string
              enum:
                - "off"
                - key_pages
                - all_known
              description: "When a known person on the site alerts the team now: off, key_pages (default: a key page reached), all_known (any visit)."
            live_alert_tasks:
              type: boolean
              description: "A live alert also opens a task, due now, on each of the person's open threads. false: only the notice goes. Default true."
            live_alert_task_minutes:
              type: integer
              nullable: true
              description: "How long that task lives: still open after this many minutes, the sweep cancels it and it reads as expired. 5 to 43200 (30 days); null = it never expires. Default 30."
            inbound_playtable_sid:
              type: string
              nullable: true
              description: pt_tb_... the table an identified visitor nobody has would be handed to; stored only today, nothing reads it yet.
            created_by:
              type: object
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                actor_name:
                  type: string
                  nullable: true
                  description: The OAuth client that acted ("Claude", "n8n"); null for a user, an API key or a system job.
                oauth_client_sid:
                  type: string
                  nullable: true
                  description: The acting OAuth client (id_oc_*); null off the OAuth path.
                reason:
                  type: string
                  nullable: true
                  description: Why a system actor wrote the row (snapshot_capture_job, ...); null otherwise.
                permissions:
                  type: object
                  additionalProperties: {}
                  description: "Internal audit context: the grant set the actor held at write time. Not a contract."
                cluster_id:
                  type: integer
                  nullable: true
                  description: "Internal audit context: the cluster that served the write."
                trace_id:
                  type: string
                  nullable: true
                  description: "Internal audit context: the trace id of the request that wrote the row."
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
              description: Actor that registered the site.
            created_at:
              type: string
              description: ISO 8601 UTC.
            updated_at:
              type: string
              description: ISO 8601 UTC.
            deleted_at:
              type: string
              nullable: true
              description: ISO 8601 UTC; null = live. A deleted site keeps its sessions and visitors.
          required:
            - sid
            - team_sid
            - domain
            - include_subdomains
            - site_key
            - status
            - verified_at
            - last_check_at
            - last_check_result
            - broken_reason
            - last_hit_at
            - hits_count_24h
            - identification
            - identification_confirmation
            - link_codes_enabled
            - carrier_linkedin
            - carrier_email
            - consent_mode
            - fingerprint_mode
            - anonymize_ip
            - ignored_ips
            - live_alerts
            - live_alert_tasks
            - live_alert_task_minutes
            - inbound_playtable_sid
            - created_by
            - created_at
            - updated_at
            - deleted_at
        result:
          type: object
          properties:
            loader:
              type: object
              properties:
                html:
                  type: string
                  description: "The two script tags to paste into every page of the site, before </body>: the inline part with this site's key (it captures the fragment and the query before a router rewrites the address), then the async collector script."
                script_url:
                  type: string
                  description: The collector script's URL, as the second tag loads it.
              required:
                - html
                - script_url
              description: "The loader with the new key: what replaces the one on the site."
          required:
            - loader
        meta:
          type: object
          properties:
            trace_id:
              type: string
              description: UUID v7; same 128-bit value as the X-Trace-Id header.
            span_id:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 16 hex chars, root span of this request.
            timestamp:
              type: string
              description: ISO 8601 UTC (Y-m-dTH:i:sZ), response time.
            duration_ms:
              type: integer
              minimum: 0
              description: Server-side wall clock.
            team_sid:
              type: string
              nullable: true
              description: The team this call ran in (the token team, or the team_sid override). Null when unauthenticated; absent from pre-2026-08-20 backends.
            actor_type:
              type: string
              nullable: true
              description: user | agent | api_key | system. Null when unauthenticated; absent from pre-2026-08-20 backends.
          required:
            - trace_id
            - span_id
            - timestamp
            - duration_ms
      required:
        - success
        - operation
        - action
        - item
        - result
        - meta
    SearchProfileViewSightingsRequest:
      type: object
      description: Request body of `search_profile_view_sightings`.
      properties:
        filter:
          type: object
          properties:
            sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^sg_pv_
                  description: Profile view sighting sid (sg_pv_...).
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^sg_pv_
                    description: Profile view sighting sid (sg_pv_...).
              additionalProperties: false
              description: Sighting sid(s), sg_pv_ prefix.
            sender_profile_sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^ub_sp_
                  description: "Sender profile sid (ub_sp_..., external: unibox), the sender profile whose list the viewer was on."
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^ub_sp_
                    description: "Sender profile sid (ub_sp_..., external: unibox), the sender profile whose list the viewer was on."
              additionalProperties: false
              description: "One sender profile's list: the sender profile's card (find the sid with search_sender_profiles)."
            person_sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^cr_pp_
                  description: "Person sid (cr_pp_..., external: playtables)."
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^cr_pp_
                    description: "Person sid (cr_pp_..., external: playtables)."
                is_null:
                  type: boolean
              additionalProperties: false
              description: One person's sightings; is_null false = the viewers the team holds as people, is_null true = the ones it does not (anonymous rows among them).
            is_anonymous:
              type: object
              properties:
                eq:
                  type: boolean
              additionalProperties: false
              description: true = a descriptor or no identifier; false = a named viewer, held as a person or not.
            first_seen_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
              additionalProperties: false
              description: "ISO 8601 bounds on the first sighting: the viewers new in a window. Combine bounds in one object."
            last_seen_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
              additionalProperties: false
              description: "ISO 8601 bounds on the last sighting: the week's window (\"this week\" is gte seven days ago). Combine bounds in one object."
          description: "Field filters, ANDed: {field: {eq | ne | in | nin | gte | lte | gt | lt | is_null}}; q inside it is free text. Omit for every row."
        include:
          type: array
          items:
            type: string
            enum:
              - person
            description: "person: the person's sid (the card is owed)."
          description: Relations to attach to every item; omit for the bare rows.
        sort:
          type: object
          properties:
            field:
              type: string
              enum:
                - first_seen_at
                - last_seen_at
                - times_seen
              description: The column to order by.
            direction:
              type: string
              enum:
                - asc
                - desc
              description: asc or desc; default desc.
          required:
            - field
          description: One column and its direction; omit for the default order.
        page_size:
          type: integer
          minimum: 0
          maximum: 500
          description: 0..500, default 50; 0 = counts only, 1 = the first row.
        cursor:
          type: string
          nullable: true
          description: pagination.next_cursor of the previous page.
    SearchProfileViewSightingsResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - search
        items:
          type: array
          items:
            type: object
            properties:
              item:
                type: object
                properties:
                  sid:
                    type: string
                    description: Profile view sighting sid (sg_pv_...).
                  team_sid:
                    type: string
                    description: "Owning team (ts_tm_..., external: gs.service.id)."
                  sender_profile_sid:
                    type: string
                    description: "The sender profile whose \"Who viewed your profile\" list the viewer was on (ub_sp_..., external: unibox). The same person on two sender profiles is two rows: the view is the sender profile's."
                  viewer_key:
                    type: string
                    description: "The one key of the viewer per sender profile: the member id (digits) for a named viewer, nick:<slug> when the list named them by the public slug alone, anon:<hash> for an anonymous row or a named row with no identifier. Never a URL."
                  is_anonymous:
                    type: boolean
                    description: 'LinkedIn printed a descriptor instead of a name ("Someone at Acme"), or no identifier at all: counted, never resolved, never told to the product.'
                  ln_member_id:
                    type: string
                    nullable: true
                    description: The canonical member id (the member URN or the profile URN decoded); null for an anonymous or slug-only viewer.
                  ln_nickname:
                    type: string
                    nullable: true
                    description: The public profile slug the list carried, lowercased; null when none.
                  person_sid:
                    type: string
                    nullable: true
                    description: The team's person the viewer resolved to (cr_pp_..., playtables), by member id then by slug; null while unknown (asked about again at every run for ninety days).
                  display_name:
                    type: string
                    nullable: true
                    description: The list's words at the last sighting (the descriptor for an anonymous row); null when none.
                  headline:
                    type: string
                    nullable: true
                    description: The viewer's headline as the list printed it; null when none.
                  image_url:
                    type: string
                    nullable: true
                    description: The avatar the list carried (not a profile URL); null when none.
                  viewed_at_text:
                    type: string
                    nullable: true
                    description: 'The relative text LinkedIn printed last ("2 days ago"): the list carries no date; null when none.'
                  times_seen:
                    type: integer
                    minimum: 1
                    description: The first sighting and every re-view since (a listing that moved the viewer up).
                  last_position:
                    type: integer
                    minimum: 0
                    description: "The row's absolute rank on the list at the last sighting: the collector's stop rule."
                  first_seen_at:
                    type: string
                    description: 'ISO 8601 UTC, when the collector first saw the viewer on this sender profile: the "since" the product can honestly say.'
                  previous_seen_at:
                    type: string
                    nullable: true
                    description: ISO 8601 UTC, the sighting before the last; null on a viewer seen once.
                  last_seen_at:
                    type: string
                    description: "ISO 8601 UTC, the last sighting: the default sort and the week's window."
                  last_fact_at:
                    type: string
                    nullable: true
                    description: ISO 8601 UTC, the last sighting the ledger and the thread were told about (or that needed no telling); null while the first sighting of a known person is owed, always null for an anonymous or unknown viewer.
                  created_at:
                    type: string
                    description: ISO 8601 UTC.
                  updated_at:
                    type: string
                    description: ISO 8601 UTC.
                required:
                  - sid
                  - team_sid
                  - sender_profile_sid
                  - viewer_key
                  - is_anonymous
                  - ln_member_id
                  - ln_nickname
                  - person_sid
                  - display_name
                  - headline
                  - image_url
                  - viewed_at_text
                  - times_seen
                  - last_position
                  - first_seen_at
                  - previous_seen_at
                  - last_seen_at
                  - last_fact_at
                  - created_at
                  - updated_at
              included:
                type: object
                properties:
                  person:
                    type: object
                    properties:
                      sid:
                        type: string
                    required:
                      - sid
                    description: "The team's person the viewer resolved to: { sid } today (cr_pp_...), the compact card is owed. Absent for an anonymous viewer or one the team does not hold."
            required:
              - item
              - included
        pagination:
          type: object
          properties:
            next_cursor:
              type: string
              nullable: true
            has_more:
              type: boolean
            total_count:
              type: integer
              nullable: true
          required:
            - next_cursor
            - has_more
            - total_count
        applied_filters:
          type: object
          additionalProperties: {}
        includes:
          type: array
          items:
            type: string
        meta:
          type: object
          properties:
            trace_id:
              type: string
              description: UUID v7; same 128-bit value as the X-Trace-Id header.
            span_id:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 16 hex chars, root span of this request.
            timestamp:
              type: string
              description: ISO 8601 UTC (Y-m-dTH:i:sZ), response time.
            duration_ms:
              type: integer
              minimum: 0
              description: Server-side wall clock.
            team_sid:
              type: string
              nullable: true
              description: The team this call ran in (the token team, or the team_sid override). Null when unauthenticated; absent from pre-2026-08-20 backends.
            actor_type:
              type: string
              nullable: true
              description: user | agent | api_key | system. Null when unauthenticated; absent from pre-2026-08-20 backends.
          required:
            - trace_id
            - span_id
            - timestamp
            - duration_ms
        counts:
          type: object
          properties:
            total_count:
              type: integer
              minimum: 0
              description: Sightings matching the filter (full filter scope, not the page).
            groups:
              type: object
              properties:
                is_anonymous:
                  anyOf:
                    - type: object
                      additionalProperties: {}
                    - type: array
                      items: {}
                  description: "Sightings per is_anonymous, keyed false and true: the named viewers against the anonymous rows; [] when none."
                sender_profile_sid:
                  anyOf:
                    - type: object
                      additionalProperties: {}
                    - type: array
                      items: {}
                  description: Sightings per sender profile (ub_sp_...); [] when none.
              required:
                - is_anonymous
                - sender_profile_sid
          required:
            - total_count
            - groups
      required:
        - success
        - operation
        - items
        - pagination
        - applied_filters
        - includes
        - meta
