                              type: string
                              description: The page view's id from the wire (12 characters).
                            path:
                              type: string
                              description: The page's path with its query, the code in our link removed by the script.
                            title:
                              type: string
                              nullable: true
                              description: The document title; null when none.
                            engaged_seconds:
                              type: integer
                              minimum: 0
                              description: The largest engaged time a ping of this page view reported, in whole seconds.
                            first_seen_at:
                              type: string
                              description: ISO 8601 UTC, the receipt time of the pageview hit.
                            scroll_pct:
                              type: integer
                              nullable: true
                              minimum: 0
                              maximum: 100
                              description: The deepest scroll a ping of this page view reported, 0 to 100; null until one did (and on visits folded before 2026-10-07).
                          required:
                            - page_id
                            - path
                            - title
                            - engaged_seconds
                            - first_seen_at
                            - scroll_pct
                        description: The first 50 page views, in order, each with its engaged time.
                      events:
                        type: array
                        items:
                          type: object
