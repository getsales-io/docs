                        type: string
                        nullable: true
                      utm_campaign:
                        type: string
                        nullable: true
                      utm_content:
                        type: string
                        nullable: true
                      utm_term:
                        type: string
                        nullable: true
                      landing_code:
                        type: string
                        nullable: true
                        description: The first code a hit of the session carried (the person code or the company code in the link we sent); null when none.
                      browser:
                        type: string
                        nullable: true
                        description: The parser's name (Chrome, Safari, Firefox...); null when unknown.
                      browser_version:
                        type: string
                        nullable: true
                      os:
                        type: string
                        nullable: true
                        description: Windows, macOS, iOS, Android, Linux...; null when unknown.
                      os_version:
                        type: string
                        nullable: true
                      device:
                        type: string
                        enum:
                          - desktop
                          - mobile
                          - tablet
                          - unknown
                        description: desktop | mobile | tablet | unknown.
                      screen:
                        type: string
                        nullable: true
                        description: "{width}x{height} of the screen; null when the first page view did not report it."
                      language:
                        type: string
                        nullable: true
                        description: The browser's first language; null when not reported.
                      timezone:
                        type: string
                        nullable: true
                        description: The browser's IANA zone; null when not reported.
                      geo_country:
                        type: string
                        nullable: true
