            - verified_at
            - last_check_at
            - last_check_result
            - broken_reason
            - last_hit_at
            - hits_count_24h
            - identification
            - identification_confirmation
            - link_codes_enabled
            - carrier_linkedin
            - carrier_email
            - consent_mode
            - fingerprint_mode
            - anonymize_ip
            - ignored_ips
            - live_alerts
            - live_alert_tasks
            - live_alert_task_minutes
            - inbound_playtable_sid
            - created_by
            - created_at
            - updated_at
            - deleted_at
        result:
          type: object
          properties:
            outcome:
              type: string
              enum:
                - found
                - site_key_mismatch
                - loader_missing
                - fetch_failed
              description: The best outcome over the pages fetched.
            previous_status:
              type: string
              enum:
                - pending
                - verified
                - broken
                - disabled
              description: The status before the check.
            status:
              type: string
              enum:
                - pending
                - verified
                - broken
                - disabled
              description: "The status after the health rule: verified on found; a silent verified site may turn broken; pending and broken stay as they were on anything but found."
          required:
            - outcome
            - previous_status
            - status
        meta:
          type: object
          properties:
            trace_id:
              type: string
              description: UUID v7; same 128-bit value as the X-Trace-Id header.
            span_id:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 16 hex chars, root span of this request.
            timestamp:
              type: string
              description: ISO 8601 UTC (Y-m-dTH:i:sZ), response time.
            duration_ms:
              type: integer
              minimum: 0
              description: Server-side wall clock.
            team_sid:
              type: string
              nullable: true
              description: The team this call ran in (the token team, or the team_sid override). Null when unauthenticated; absent from pre-2026-08-20 backends.
            actor_type:
              type: string
              nullable: true
              description: user | agent | api_key | system. Null when unauthenticated; absent from pre-2026-08-20 backends.
          required:
            - trace_id
            - span_id
            - timestamp
            - duration_ms
      required:
        - success
        - operation
        - action
        - item
        - result
        - meta
