    UpdateWebsiteSiteRequest:
      type: object
      description: Request body of `update_website_site`.
      properties:
        identification:
          type: string
          enum:
            - companies
            - people
          description: companies or people. A switch to people needs confirm_identification true in the same call; a switch to companies needs none and keeps the stored confirmation.
        confirm_identification:
          type: boolean
          description: "true only after the person confirmed the customer's duties for the level the site ends at: stored as identification_confirmation, also on its own (a site with none gets no codes). false is the same as leaving it out."
        include_subdomains:
          type: boolean
          description: Hosts under the domain belong to the site. Default true.
        link_codes_enabled:
          type: boolean
          description: Code the links to this site (once it is verified and confirmed for its level, and while the team switch is on). Default true.
        carrier_linkedin:
          type: string
          enum:
            - fragment
            - query
          description: "Where the code rides in a LinkedIn link: fragment (default) or query."
        carrier_email:
          type: string
          enum:
            - fragment
            - query
          description: "Where the code rides in an email link: query (default) or fragment."
        consent_mode:
          type: string
          enum:
            - not_required
            - required
          description: not_required (default) stores the visitor id on the first hit; required waits for the site's banner to call gs('consent', true).
        fingerprint_mode:
          type: string
          enum:
            - "on"
            - consent
            - "off"
          description: on (default), consent (only after consent) or off.
        anonymize_ip:
          type: boolean
          description: Keep a resolved session's address as its network part only. Default false.
        ignored_ips:
          type: array
          items:
            type: string
          maxItems: 50
          description: IPv4 or IPv6 addresses or CIDR ranges of internal traffic (the office, the VPN). Replaced whole; at most 50; an entry that is neither is 422 invalid_ip.
        live_alerts:
          type: string
          enum:
            - "off"
            - key_pages
            - all_known
          description: "off | key_pages (default) | all_known: when a known person on the site alerts the team now."
        live_alert_tasks:
          type: boolean
          description: A live alert also opens a task, due now, on the person's open threads. Default true; false sends the notice alone.
        live_alert_task_minutes:
          type: integer
          nullable: true
          minimum: 5
          maximum: 43200
          description: "The life of that task in minutes, 5 to 43200 (30 days): still open by then, the sweep cancels it. null = it never expires. Default 30."
        inbound_playtable_sid:
          type: string
          nullable: true
          minLength: 18
          maxLength: 18
          pattern: ^pt_tb_
          description: The table an identified visitor nobody has would be handed to; stored only today. null clears it.
        enabled:
          type: boolean
          description: "false switches the site off (status disabled: hits dropped, no codes); true brings it back as verified when it had been verified and was not broken, else as pending. Already in that state changes nothing."
    UpdateWebsiteSiteResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - update
        item:
          type: object
          properties:
            sid:
              type: string
              description: Website site sid (sg_si_...).
            team_sid:
              type: string
              description: "Owning team (ts_tm_..., external: gs.service.id)."
            domain:
              type: string
              description: "The host as the team typed it, reduced to a bare hostname: lowercased, no scheme, port or path, a leading www. dropped. Immutable: a different host is a different site."
            include_subdomains:
              type: boolean
              description: Hosts under domain belong to the site (default true).
            site_key:
              type: string
              description: The public 20-character key the loader carries (gs.k). It names the site to the collector; not a secret. Changes only through rotate_website_site_key.
            status:
              type: string
              enum:
                - pending
                - verified
                - broken
                - disabled
              description: pending = waiting for the script (links to it are not coded yet); verified = receiving; broken = the health rule flagged it (see broken_reason); disabled = switched off by update enabled false.
            verified_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, the last transition into verified; null never.
            last_check_at:
              type: string
              nullable: true
