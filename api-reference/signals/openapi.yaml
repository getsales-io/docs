  /api/website-visitors/{sid}/identify:
    post:
      operationId: identify_website_visitor
      summary: Identify website visitor
      description: |-
        Bind a visitor to a person of the team by hand ("the visitor from Acme's network yesterday is John"): person_sid, a live playtables person (cr_pp_), else 422 relation_not_found. It overrides any automatic bind; the visitor's open session and its sessions of the last 30 days nobody owned go to the person, their facts written by a queued job. On a site set to companies it is 409 invalid_transition (companies_level). The same person again changes nothing. Undo with unlink_website_visitor.

        Contract:
        - MCP tool `identify_website_visitor`, registry package `mcp.signals/website_visitors`, mount `signals.visits`.
        - Operation `action`, response envelope `action`.
        - Flags: none.
      tags:
        - website_visitors
      parameters:
        - name: sid
          in: path
          required: true
          description: Website visitor sid (sg_wv_...).
          schema:
            type: string
            minLength: 18
            maxLength: 18
            pattern: ^sg_wv_
            description: Website visitor sid (sg_wv_...).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyWebsiteVisitorRequest"
      responses:
        "200":
          description: "`action` success envelope."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyWebsiteVisitorResponse"
        4XX:
          $ref: "#/components/responses/McpClientError"
        5XX:
          $ref: "#/components/responses/McpServerError"
      x-gs-mcp-tool: identify_website_visitor
      x-gs-mcp-mount: signals.visits
      x-gs-entity: website_visitors
      x-gs-operation: action
      x-gs-envelope: action
      x-gs-availability: ga
      x-gs-dangerous: false
      x-gs-mass-action: false
      x-gs-step-eligible: false
      x-gs-schedule-required: false
      x-gs-tool-class: typical
  /api/website-visitors/{sid}/unlink:
    post:
      operationId: unlink_website_visitor
      summary: Unlink website visitor
      description: |-
        Clear a visitor's bind: person_sid, bound_by, bound_at and identified_email. Sessions already attributed keep their person and the facts written stay. Already unbound answers was_bound false.

        Contract:
        - MCP tool `unlink_website_visitor`, registry package `mcp.signals/website_visitors`, mount `signals.visits`.
        - Operation `action`, response envelope `action`.
        - Flags: dangerous: the MCP layer gates it behind a preview/commit token, and the effect cannot be undone through this API.
      tags:
        - website_visitors
      parameters:
        - name: sid
          in: path
          required: true
          description: Website visitor sid (sg_wv_...).
          schema:
            type: string
            minLength: 18
            maxLength: 18
            pattern: ^sg_wv_
            description: Website visitor sid (sg_wv_...).
      responses:
        "200":
          description: "`action` success envelope."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkWebsiteVisitorResponse"
        4XX:
          $ref: "#/components/responses/McpClientError"
        5XX:
          $ref: "#/components/responses/McpServerError"
      x-gs-mcp-tool: unlink_website_visitor
      x-gs-mcp-mount: signals.visits
      x-gs-entity: website_visitors
      x-gs-operation: action
      x-gs-envelope: action
      x-gs-availability: ga
      x-gs-dangerous: true
      x-gs-mass-action: false
      x-gs-step-eligible: false
      x-gs-schedule-required: false
      x-gs-tool-class: trivial
components:
  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by gs.service.id. Its `access_identity` claim carries `team_sid`, `actor_sid` and `actor_type`, and that team scope is authoritative.
    TeamSid:
      type: apiKey
      in: header
      name: Team-SID
      description: Team scope for tokens that do not carry one. Ignored when the token already names a team.
  responses:
    McpClientError:
      description: MCP error envelope. `error.code` is one of validation_failed, nothing_to_update, not_found, relation_not_found, invalid_transition, limit_exceeded, payment_required, duplicate_rejected, conflict, delete_blocked, unauthorized, forbidden, rate_limited, not_implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/McpError"
    McpServerError:
      description: MCP error envelope with `error.code` internal_error or service_unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/McpError"
  schemas:
    CreateWebsiteKeyPageRequest:
      type: object
      description: Request body of `create_website_key_page`.
      properties:
        site_sid:
          type: string
          minLength: 18
          maxLength: 18
          pattern: ^sg_si_
          description: Website site sid (sg_si_...), the page's site.
        key:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_-]*$
          description: "A stable lowercase slug, unique within the site, immutable: the name facts, the key_page filter and the signal visited_key_page carry."
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: What the page is called in the feed (Pricing).
        pattern:
          type: string
          maxLength: 2048
          description: "A path glob or a pasted URL (reduced to its path): * stands for any run of characters, matching ignores case and a trailing slash (/plans*). No path readable is 422 invalid_pattern."
        is_conversion:
          type: boolean
          description: "Count a visit as a conversion. Default false: visiting /signup is not a signup."
      required:
        - site_sid
        - key
        - label
        - pattern
    CreateWebsiteKeyPageResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - create
        item:
          type: object
          properties:
            sid:
              type: string
              description: Website key page sid (sg_kp_...).
            team_sid:
              type: string
              description: "Owning team (ts_tm_..., external: gs.service.id)."
            site_sid:
              type: string
              description: The site the page belongs to (sg_si_...).
            key:
              type: string
              description: The stable lowercase slug (pricing) facts and signals carry; immutable.
            label:
              type: string
              description: What the page is called in the feed.
            pattern:
              type: string
              description: "The path glob as stored: a leading slash, lowercased, no query or fragment, * for any run of characters (/pricing*)."
            is_conversion:
              type: boolean
              description: Counted as a conversion in the feed and the Overview card.
            created_by:
              type: object
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                actor_name:
                  type: string
                  nullable: true
                  description: The OAuth client that acted ("Claude", "n8n"); null for a user, an API key or a system job.
                oauth_client_sid:
                  type: string
                  nullable: true
                  description: The acting OAuth client (id_oc_*); null off the OAuth path.
                reason:
                  type: string
                  nullable: true
                  description: Why a system actor wrote the row (snapshot_capture_job, ...); null otherwise.
                permissions:
                  type: object
                  additionalProperties: {}
                  description: "Internal audit context: the grant set the actor held at write time. Not a contract."
                cluster_id:
                  type: integer
                  nullable: true
                  description: "Internal audit context: the cluster that served the write."
                trace_id:
                  type: string
                  nullable: true
                  description: "Internal audit context: the trace id of the request that wrote the row."
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
              description: Actor that named the page (the site create, or this entity's create).
            created_at:
              type: string
              description: ISO 8601 UTC.
            updated_at:
              type: string
              description: ISO 8601 UTC.
            deleted_at:
              type: string
              nullable: true
              description: ISO 8601 UTC; null = live. Also set by the site's cleanup job.
          required:
            - sid
            - team_sid
            - site_sid
            - key
            - label
            - pattern
            - is_conversion
            - created_by
            - created_at
            - updated_at
            - deleted_at
        already_exists:
          type: boolean
        meta:
          type: object
          properties:
            trace_id:
              type: string
              description: UUID v7; same 128-bit value as the X-Trace-Id header.
            span_id:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 16 hex chars, root span of this request.
            timestamp:
              type: string
              description: ISO 8601 UTC (Y-m-dTH:i:sZ), response time.
            duration_ms:
              type: integer
              minimum: 0
              description: Server-side wall clock.
            team_sid:
              type: string
              nullable: true
              description: The team this call ran in (the token team, or the team_sid override). Null when unauthenticated; absent from pre-2026-08-20 backends.
            actor_type:
              type: string
              nullable: true
              description: user | agent | api_key | system. Null when unauthenticated; absent from pre-2026-08-20 backends.
          required:
            - trace_id
            - span_id
            - timestamp
            - duration_ms
      required:
        - success
        - operation
        - item
        - already_exists
        - meta
    CreateWebsiteSiteRequest:
      type: object
      description: Request body of `create_website_site`.
      properties:
        domain:
          type: string
          maxLength: 2048
          description: "A host or a URL (acme.com, https://www.acme.com/pricing): reduced to the bare host. app.acme.com registers that host alone."
        identification:
          type: string
          enum:
            - companies
            - people
          description: "What a visit may name: companies (default) or people. The person picks it once both are explained."
        confirm_identification:
          type: boolean
          enum:
            - true
          description: Required, true only after the person confirmed that, for the level chosen, collecting consent from visitors in the EU, the EEA and the UK and saying so in their privacy policy is their own duty. Stored as identification_confirmation.
        include_subdomains:
          type: boolean
          description: Hosts under the domain belong to the site. Default true.
        link_codes_enabled:
          type: boolean
          description: Code the links to this site (once it is verified and confirmed for its level, and while the team switch is on). Default true.
        carrier_linkedin:
          type: string
          enum:
            - fragment
            - query
          description: "Where the code rides in a LinkedIn link: fragment (default) or query."
        carrier_email:
          type: string
          enum:
            - fragment
            - query
          description: "Where the code rides in an email link: query (default) or fragment."
        consent_mode:
          type: string
          enum:
            - not_required
            - required
          description: not_required (default) stores the visitor id on the first hit; required waits for the site's banner to call gs('consent', true).
        fingerprint_mode:
          type: string
          enum:
            - "on"
            - consent
            - "off"
          description: on (default), consent (only after consent) or off.
        anonymize_ip:
          type: boolean
          description: Keep a resolved session's address as its network part only. Default false.
        ignored_ips:
          type: array
          items:
            type: string
          maxItems: 50
          description: IPv4 or IPv6 addresses or CIDR ranges of internal traffic (the office, the VPN). Replaced whole; at most 50; an entry that is neither is 422 invalid_ip.
        live_alerts:
          type: string
          enum:
            - "off"
            - key_pages
            - all_known
          description: "off | key_pages (default) | all_known: when a known person on the site alerts the team now."
        live_alert_tasks:
          type: boolean
          description: A live alert also opens a task, due now, on the person's open threads. Default true; false sends the notice alone.
        live_alert_task_minutes:
          type: integer
          nullable: true
          minimum: 5
          maximum: 43200
          description: "The life of that task in minutes, 5 to 43200 (30 days): still open by then, the sweep cancels it. null = it never expires. Default 30."
        inbound_playtable_sid:
          type: string
          nullable: true
          minLength: 18
          maxLength: 18
          pattern: ^pt_tb_
          description: The table an identified visitor nobody has would be handed to; stored only today. null clears it.
        key_pages:
          type: array
          nullable: true
          items:
            type: object
            properties:
              key:
                type: string
                maxLength: 64
                pattern: ^[a-z0-9][a-z0-9_-]*$
                description: "A stable lowercase slug (pricing), unique within the site, immutable: the name facts and signals carry."
              label:
                type: string
                minLength: 1
                maxLength: 120
                description: What the page is called in the feed (Pricing).
              pattern:
                type: string
                maxLength: 2048
                description: "A path glob or a pasted URL (reduced to its path): * stands for any run of characters, matching ignores case and a trailing slash (/pricing*)."
              is_conversion:
                type: boolean
                description: Count it as a conversion in the feed and the Overview card. Default false.
            required:
              - key
              - label
              - pattern
          maxItems: 20
          description: The pages whose visits matter, created with the site in one transaction. Absent or null = the default four (pricing, demo, signup, contact, none a conversion); [] = none. At most 20.
      required:
        - domain
        - confirm_identification
    CreateWebsiteSiteResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - create
        item:
          type: object
          properties:
            sid:
              type: string
              description: Website site sid (sg_si_...).
            team_sid:
              type: string
              description: "Owning team (ts_tm_..., external: gs.service.id)."
            domain:
              type: string
              description: "The host as the team typed it, reduced to a bare hostname: lowercased, no scheme, port or path, a leading www. dropped. Immutable: a different host is a different site."
            include_subdomains:
              type: boolean
              description: Hosts under domain belong to the site (default true).
            site_key:
              type: string
              description: The public 20-character key the loader carries (gs.k). It names the site to the collector; not a secret. Changes only through rotate_website_site_key.
            status:
              type: string
              enum:
                - pending
                - verified
                - broken
                - disabled
              description: pending = waiting for the script (links to it are not coded yet); verified = receiving; broken = the health rule flagged it (see broken_reason); disabled = switched off by update enabled false.
            verified_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, the last transition into verified; null never.
            last_check_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, the last active check (verify_website_site or the daily job); null never.
            last_check_result:
              type: object
              nullable: true
              properties:
                outcome:
                  type: string
                  enum:
                    - found
                    - site_key_mismatch
                    - loader_missing
                    - fetch_failed
                  description: "The best outcome over pages: found wins over site_key_mismatch, over loader_missing, over fetch_failed."
                pages:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        description: The URL requested last for this page.
                      key_page_sid:
                        type: string
                        nullable: true
                        description: sg_kp_... the key page this row checked; null for the home page.
                      outcome:
                        type: string
                        enum:
                          - found
                          - site_key_mismatch
                          - loader_missing
                          - fetch_failed
                        description: "found: the page carries this site's key. site_key_mismatch: a loader with another key. loader_missing: no loader in the page source (a tag manager installs it outside the source, so such a site is verified by its first hit instead). fetch_failed: no page to read, see failure."
                      http_status:
                        type: integer
                        nullable: true
                        description: The final HTTP status; null when no answer arrived.
                      failure:
                        type: string
                        nullable: true
                        enum:
                          - invalid_url
                          - scheme_not_allowed
                          - credentials_in_url
                          - port_not_allowed
                          - ip_literal
                          - host_unresolvable
                          - private_address
                          - redirect_without_location
                          - too_many_redirects
                          - redirected_off_site
                          - connection_failed
                          - http_status
                        description: "Why the fetch failed, when outcome is fetch_failed: the guard refused the URL (scheme, port, credentials, an IP literal, a private address), the host did not resolve, the redirects ran out or left the site, the connection failed, or the status was outside 2xx. Null otherwise."
                    required:
                      - url
                      - key_page_sid
                      - outcome
                      - http_status
                      - failure
                  description: The home page first, then the checkable key pages (a pattern that names one URL).
              required:
                - outcome
                - pages
              description: What the last active check found, page by page; null while no check ran, and cleared by a key rotation.
            broken_reason:
              type: string
              nullable: true
              enum:
                - loader_missing
                - fetch_failed
                - site_key_mismatch
                - no_hits
              description: "Set while broken: loader_missing (the source lost the loader and the hits stopped), fetch_failed (two checks in a row could not read the site while it was silent), site_key_mismatch (another key in the loader), no_hits (a tag-manager install whose hits stopped). Null otherwise."
            last_hit_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, the newest hit the collector reported; null while nothing was received.
            hits_count_24h:
              type: integer
              minimum: 0
              description: Hits in the current UTC hour and the 23 before it, refreshed on every hit batch and every check (a rolling window, not "today").
            identification:
              type: string
              enum:
                - companies
                - people
              description: "What a visit to the site may name. companies (default): links carry the recipient's company code and a visit shows the company, never a person. people: visits from the people the team writes to are shown by name."
            identification_confirmation:
              type: object
              nullable: true
              properties:
                identification:
                  type: string
                  enum:
                    - companies
                    - people
                  description: "The level confirmed: people covers both levels, companies only itself."
                confirmed_at:
                  type: string
                  description: ISO 8601 UTC.
                confirmed_by:
                  type: object
                  properties:
                    actor_type:
                      type: string
                      enum:
                        - user
                        - support
                        - api_key
                        - system
                        - agent
                    actor_sid:
                      type: string
                      nullable: true
                    team_sid:
                      type: string
                    actor_name:
                      type: string
                      nullable: true
                      description: The OAuth client that acted ("Claude", "n8n"); null for a user, an API key or a system job.
                    oauth_client_sid:
                      type: string
                      nullable: true
                      description: The acting OAuth client (id_oc_*); null off the OAuth path.
                    reason:
                      type: string
                      nullable: true
                      description: Why a system actor wrote the row (snapshot_capture_job, ...); null otherwise.
                    permissions:
                      type: object
                      additionalProperties: {}
                      description: "Internal audit context: the grant set the actor held at write time. Not a contract."
                    cluster_id:
                      type: integer
                      nullable: true
                      description: "Internal audit context: the cluster that served the write."
                    trace_id:
                      type: string
                      nullable: true
                      description: "Internal audit context: the trace id of the request that wrote the row."
                  required:
                    - actor_type
                    - actor_sid
                    - team_sid
                    - permissions
                  description: Who confirmed.
              required:
                - identification
                - confirmed_at
                - confirmed_by
              description: The customer's latest confirmation of its duties for a level, by whom and when. Links are coded only while it covers the site's level; null = none yet.
            link_codes_enabled:
              type: boolean
              description: Links to this site get a code (the company's or the person's, by identification) when the site is verified, identification_confirmation covers its level and the team switch (signal_settings.website_link_codes) is on. Default true.
            carrier_linkedin:
              type: string
              enum:
                - fragment
                - query
              description: "Where the code rides in a link sent on LinkedIn: fragment (#g_<code>, default) or query (?gs=<code>)."
            carrier_email:
              type: string
              enum:
                - fragment
                - query
              description: "Where the code rides in a link sent by email: query (default) or fragment."
            consent_mode:
              type: string
              enum:
                - not_required
                - required
              description: "not_required (default): the first-party visitor id is stored on the first hit. required: nothing is stored until the site's banner calls gs('consent', true); until then a visit is attributed by the code in the link alone."
            fingerprint_mode:
              type: string
              enum:
                - "on"
                - consent
                - "off"
              description: "on (default): the device fingerprint is collected (answered as consent when consent_mode is required); consent: only after consent; off: never."
            anonymize_ip:
              type: boolean
              description: Once a session's network is resolved, keep the address's network part only (the last octet, or the last 80 bits of IPv6, zeroed). Default false.
            ignored_ips:
              type: array
              items:
                type: string
              description: "IPv4 or IPv6 addresses or CIDR ranges whose visits are internal (the office, the VPN egress): shown under their own filter, never a fact, never a signal. At most 50."
            live_alerts:
              type: string
              enum:
                - "off"
                - key_pages
                - all_known
              description: "When a known person on the site alerts the team now: off, key_pages (default: a key page reached), all_known (any visit)."
            live_alert_tasks:
              type: boolean
              description: "A live alert also opens a task, due now, on each of the person's open threads. false: only the notice goes. Default true."
            live_alert_task_minutes:
              type: integer
              nullable: true
              description: "How long that task lives: still open after this many minutes, the sweep cancels it and it reads as expired. 5 to 43200 (30 days); null = it never expires. Default 30."
            inbound_playtable_sid:
              type: string
              nullable: true
              description: pt_tb_... the table an identified visitor nobody has would be handed to; stored only today, nothing reads it yet.
            created_by:
              type: object
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                actor_name:
                  type: string
                  nullable: true
                  description: The OAuth client that acted ("Claude", "n8n"); null for a user, an API key or a system job.
                oauth_client_sid:
                  type: string
                  nullable: true
                  description: The acting OAuth client (id_oc_*); null off the OAuth path.
                reason:
                  type: string
                  nullable: true
                  description: Why a system actor wrote the row (snapshot_capture_job, ...); null otherwise.
                permissions:
                  type: object
                  additionalProperties: {}
                  description: "Internal audit context: the grant set the actor held at write time. Not a contract."
                cluster_id:
                  type: integer
                  nullable: true
                  description: "Internal audit context: the cluster that served the write."
                trace_id:
                  type: string
                  nullable: true
                  description: "Internal audit context: the trace id of the request that wrote the row."
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
              description: Actor that registered the site.
            created_at:
              type: string
              description: ISO 8601 UTC.
            updated_at:
              type: string
              description: ISO 8601 UTC.
            deleted_at:
              type: string
              nullable: true
              description: ISO 8601 UTC; null = live. A deleted site keeps its sessions and visitors.
          required:
            - sid
            - team_sid
            - domain
            - include_subdomains
            - site_key
            - status
            - verified_at
            - last_check_at
            - last_check_result
            - broken_reason
            - last_hit_at
            - hits_count_24h
            - identification
            - identification_confirmation
            - link_codes_enabled
            - carrier_linkedin
            - carrier_email
