    SearchWebsiteSessionsRequest:
      type: object
      description: Request body of `search_website_sessions`.
      properties:
        filter:
          type: object
          properties:
            sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^sg_ws_
                  description: Website session sid (sg_ws_...).
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^sg_ws_
                    description: Website session sid (sg_ws_...).
              additionalProperties: false
              description: Session sid(s), sg_ws_ prefix.
            site_sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^sg_si_
                  description: Website site sid (sg_si_...).
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^sg_si_
                    description: Website site sid (sg_si_...).
              additionalProperties: false
              description: One site's visits (find the sid with search_website_sites).
            visitor_sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^sg_wv_
                  description: Website visitor sid (sg_wv_...), the browser behind the visit.
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^sg_wv_
                    description: Website visitor sid (sg_wv_...), the browser behind the visit.
              additionalProperties: false
              description: One browser's visits.
            person_sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^cr_pp_
                  description: "Person sid (cr_pp_..., external: playtables)."
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^cr_pp_
                    description: "Person sid (cr_pp_..., external: playtables)."
                is_null:
                  type: boolean
              additionalProperties: false
              description: One person's visits; is_null false = known people, is_null true = nobody named.
            company_sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^cr_co_
                  description: "Company sid (cr_co_..., external: playtables)."
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^cr_co_
                    description: "Company sid (cr_co_..., external: playtables)."
                is_null:
                  type: boolean
              additionalProperties: false
              description: The visits a company code or a network gave to one company; is_null false = known companies (a person's session carries no company_sid).
            fingerprint_sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^sg_fp_
