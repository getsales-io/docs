            last_seen_at:
              type: string
              description: "ISO 8601 UTC, the last sighting: the default sort and the week's window."
            last_fact_at:
              type: string
              nullable: true
              description: ISO 8601 UTC, the last sighting the ledger and the thread were told about (or that needed no telling); null while the first sighting of a known person is owed, always null for an anonymous or unknown viewer.
