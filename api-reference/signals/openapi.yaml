                          description: The event's name or the form's name as the site sent it. A form's email never rides here.
                        at:
                          type: string
                          description: ISO 8601 UTC, the receipt time of the hit.
                        page_id:
                          type: string
                          description: The page view the hit belonged to.
                      required:
                        - kind
                        - name
                        - at
                        - page_id
                    description: The first 50 custom events and forms, in order; every event the site sent, registered or not.
                  key_pages:
                    type: array
                    items:
                      type: string
                    description: "The keys (slugs) of the site's key pages reached, in the order first reached: what the key_page filter matches and the signal visited_key_page reads."
                  referrer_type:
                    type: string
                    enum:
                      - direct
                      - internal
                      - search
                      - social
                      - email
                      - ads
                      - referral
                      - ai_assistant
                      - unknown
                    description: "Where the visit came from, decided on the first page view: direct, internal (another page of the site), search, social, email, ads (a click id or a paid utm_medium), referral, ai_assistant (ChatGPT, Perplexity, Claude and the like), unknown."
                  referrer_host:
                    type: string
                    nullable: true
                    description: The referrer's host, lowercased, no www.; null when absent or unreadable.
                  utm_source:
                    type: string
                    nullable: true
                  utm_medium:
                    type: string
                    nullable: true
                  utm_campaign:
                    type: string
                    nullable: true
                  utm_content:
                    type: string
                    nullable: true
                  utm_term:
                    type: string
                    nullable: true
                  landing_code:
                    type: string
                    nullable: true
                    description: The first code a hit of the session carried (the person code or the company code in the link we sent); null when none.
                  browser:
                    type: string
                    nullable: true
                    description: The parser's name (Chrome, Safari, Firefox...); null when unknown.
                  browser_version:
                    type: string
                    nullable: true
                  os:
                    type: string
                    nullable: true
                    description: Windows, macOS, iOS, Android, Linux...; null when unknown.
                  os_version:
                    type: string
                    nullable: true
                  device:
                    type: string
                    enum:
                      - desktop
                      - mobile
                      - tablet
                      - unknown
                    description: desktop | mobile | tablet | unknown.
                  screen:
                    type: string
                    nullable: true
                    description: "{width}x{height} of the screen; null when the first page view did not report it."
                  language:
                    type: string
                    nullable: true
                    description: The browser's first language; null when not reported.
                  timezone:
                    type: string
                    nullable: true
                    description: The browser's IANA zone; null when not reported.
                  geo_country:
                    type: string
                    nullable: true
                    description: ISO 3166-1 alpha-2 from the edge's location header; null when the edge gave none.
                  geo_region:
                    type: string
                    nullable: true
                  geo_city:
                    type: string
                    nullable: true
                  ip:
                    type: string
                    description: The client address of the first hit (IPv4 or IPv6); its network part only once the network answer is stored on a site with anonymize_ip.
                  network_status:
                    type: string
                    enum:
                      - pending
                      - resolved
                      - failed
                      - private
                    description: pending until the data service answered for the address; resolved with the network columns filled; failed (no answer after the asks); private (an address nobody is asked about).
                  network_type:
                    type: string
                    nullable: true
                    description: "The data service's classification of the block: business, isp, mobile, hosting, education, government or unknown; null until resolved."
                  network_name:
                    type: string
                    nullable: true
                    description: The organization the block is registered to, else the registry's name of the block ("Deutsche Telekom", "Hetzner"); null until resolved.
                  network_domain:
                    type: string
                    nullable: true
                    description: The company domain the data service derived for a business network; null when none.
                  asn:
                    type: integer
                    nullable: true
                    description: The origin AS; null until resolved.
                  as_name:
                    type: string
                    nullable: true
                    description: The AS holder; null until resolved.
                  is_internal:
                    type: boolean
                    description: "A hit came from one of the site's ignored_ips, or an identified email of the team's own domains: the team's own traffic, never a fact, never a signal."
                  created_at:
                    type: string
                    description: ISO 8601 UTC.
                  updated_at:
                    type: string
                    description: ISO 8601 UTC.
                required:
                  - sid
                  - team_sid
                  - site_sid
                  - visitor_sid
                  - person_sid
                  - company_sid
                  - attribution
                  - fingerprint_sid
                  - started_at
                  - last_seen_at
                  - closed_at
                  - pageviews_count
                  - engaged_seconds
                  - entry_path
                  - exit_path
                  - pages
                  - events
                  - key_pages
                  - referrer_type
                  - referrer_host
                  - utm_source
                  - utm_medium
                  - utm_campaign
                  - utm_content
                  - utm_term
                  - landing_code
                  - browser
                  - browser_version
                  - os
                  - os_version
                  - device
                  - screen
                  - language
                  - timezone
                  - geo_country
                  - geo_region
                  - geo_city
                  - ip
                  - network_status
                  - network_type
                  - network_name
                  - network_domain
                  - asn
                  - as_name
                  - is_internal
                  - created_at
                  - updated_at
              included:
                type: object
                properties:
                  visitor:
                    type: object
                    properties:
                      sid:
                        type: string
                    required:
                      - sid
                    description: The browser behind the visit, the WebsiteVisitorDomain verbatim (bound person, identified email, sessions_count, the latest attributes; // see ./website_visitors.md).
                  person:
                    type: object
                    properties:
                      sid:
                        type: string
                    required:
                      - sid
                    description: "The person a rung named: { sid } today (cr_pp_...), the compact card is owed. Absent while person_sid is null."
                  company:
                    type: object
                    properties:
                      sid:
                        type: string
                    required:
                      - sid
                    description: "The company a company code or the network named when nobody else did: { sid } today (cr_co_...). Absent while company_sid is null."
            required:
              - item
              - included
        pagination:
          type: object
          properties:
            next_cursor:
              type: string
              nullable: true
            has_more:
              type: boolean
            total_count:
              type: integer
              nullable: true
          required:
            - next_cursor
            - has_more
            - total_count
        applied_filters:
          type: object
          additionalProperties: {}
        includes:
          type: array
          items:
            type: string
        meta:
          type: object
          properties:
            trace_id:
              type: string
              description: UUID v7; same 128-bit value as the X-Trace-Id header.
            span_id:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 16 hex chars, root span of this request.
            timestamp:
              type: string
              description: ISO 8601 UTC (Y-m-dTH:i:sZ), response time.
            duration_ms:
              type: integer
              minimum: 0
              description: Server-side wall clock.
            team_sid:
              type: string
              nullable: true
              description: The team this call ran in (the token team, or the team_sid override). Null when unauthenticated; absent from pre-2026-08-20 backends.
            actor_type:
              type: string
              nullable: true
              description: user | agent | api_key | system. Null when unauthenticated; absent from pre-2026-08-20 backends.
          required:
            - trace_id
            - span_id
            - timestamp
            - duration_ms
        counts:
          type: object
          properties:
            total_count:
              type: integer
              minimum: 0
              description: Sessions matching the filter (full filter scope, not the page).
            groups:
              type: object
              properties:
                attribution:
                  anyOf:
                    - type: object
                      additionalProperties: {}
                    - type: array
                      items: {}
                  description: Sessions per attribution (code, identified, fingerprint, manual, company_code, company_network, none); the values that occur only, [] when none.
                network_type:
                  anyOf:
                    - type: object
                      additionalProperties: {}
                    - type: array
                      items: {}
                  description: Sessions per network classification (business, isp, mobile, hosting, education, government, unknown); unresolved sessions are not a group.
                referrer_type:
                  anyOf:
                    - type: object
                      additionalProperties: {}
                    - type: array
                      items: {}
                  description: Sessions per referrer type.
                device:
                  anyOf:
                    - type: object
                      additionalProperties: {}
                    - type: array
                      items: {}
                  description: Sessions per device class.
                key_page:
                  anyOf:
                    - type: object
                      additionalProperties: {}
                    - type: array
                      items: {}
                  description: Sessions per key page slug reached; a session that reached two pages counts in both.
              required:
                - attribution
                - network_type
                - referrer_type
                - device
                - key_page
          required:
            - total_count
            - groups
      required:
        - success
        - operation
        - items
        - pagination
        - applied_filters
        - includes
        - meta
    SearchWebsiteSitesRequest:
      type: object
      description: Request body of `search_website_sites`.
      properties:
        filter:
          type: object
          properties:
            q:
              type: string
              maxLength: 128
              description: 'Free text over the host (a LIKE): "acme" finds acme.com and app.acme.com.'
            sid:
              type: object
              properties:
                eq:
                  type: string
                  minLength: 18
                  maxLength: 18
                  pattern: ^sg_si_
                  description: Website site sid (sg_si_...).
                in:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                    pattern: ^sg_si_
                    description: Website site sid (sg_si_...).
              additionalProperties: false
              description: Site sid(s), sg_si_ prefix.
            domain:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: "The host as stored: bare, lowercased, no www."
            status:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - pending
                    - verified
                    - broken
                    - disabled
                ne:
                  type: string
                  enum:
                    - pending
                    - verified
                    - broken
                    - disabled
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - pending
                      - verified
                      - broken
                      - disabled
                nin:
                  type: array
                  items:
                    type: string
                    enum:
                      - pending
                      - verified
                      - broken
                      - disabled
              additionalProperties: false
              description: pending | verified | broken | disabled.
            identification:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - companies
                    - people
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - companies
                      - people
              additionalProperties: false
              description: "companies | people: what a visit to the site may name."
            link_codes_enabled:
              type: object
              properties:
                eq:
                  type: boolean
              additionalProperties: false
              description: The per-site switch for codes in links.
            last_hit_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
              description: ISO 8601 bounds on the newest hit; is_null true = never received anything.
            created_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
              additionalProperties: false
              description: ISO 8601 range; combine bounds in one object.
            deleted_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
              description: "Default scope is { is_null: true } (live rows); stating it at all lifts the soft-delete scope."
          description: "Field filters, ANDed: {field: {eq | ne | in | nin | gte | lte | gt | lt | is_null}}; q inside it is free text. Omit for every row."
        sort:
          type: object
          properties:
            field:
              type: string
              enum:
                - created_at
                - updated_at
                - domain
                - last_hit_at
              description: The column to order by.
            direction:
              type: string
              enum:
                - asc
                - desc
              description: asc or desc; default desc.
          required:
            - field
          description: One column and its direction; omit for the default order.
        page_size:
          type: integer
          minimum: 0
          maximum: 500
          description: 0..500, default 50; 0 = counts only, 1 = the first row.
        cursor:
          type: string
          nullable: true
          description: pagination.next_cursor of the previous page.
    SearchWebsiteSitesResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - search
        items:
          type: array
          items:
            type: object
            properties:
              item:
                type: object
                properties:
                  sid:
                    type: string
                    description: Website site sid (sg_si_...).
                  team_sid:
                    type: string
                    description: "Owning team (ts_tm_..., external: gs.service.id)."
                  domain:
                    type: string
                    description: "The host as the team typed it, reduced to a bare hostname: lowercased, no scheme, port or path, a leading www. dropped. Immutable: a different host is a different site."
                  include_subdomains:
                    type: boolean
                    description: Hosts under domain belong to the site (default true).
                  site_key:
                    type: string
                    description: The public 20-character key the loader carries (gs.k). It names the site to the collector; not a secret. Changes only through rotate_website_site_key.
                  status:
                    type: string
                    enum:
                      - pending
                      - verified
                      - broken
                      - disabled
                    description: pending = waiting for the script (links to it are not coded yet); verified = receiving; broken = the health rule flagged it (see broken_reason); disabled = switched off by update enabled false.
                  verified_at:
                    type: string
                    nullable: true
                    description: ISO 8601 UTC, the last transition into verified; null never.
                  last_check_at:
                    type: string
                    nullable: true
                    description: ISO 8601 UTC, the last active check (verify_website_site or the daily job); null never.
                  last_check_result:
                    type: object
                    nullable: true
                    properties:
                      outcome:
                        type: string
                        enum:
                          - found
                          - site_key_mismatch
                          - loader_missing
                          - fetch_failed
                        description: "The best outcome over pages: found wins over site_key_mismatch, over loader_missing, over fetch_failed."
                      pages:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              description: The URL requested last for this page.
                            key_page_sid:
                              type: string
                              nullable: true
                              description: sg_kp_... the key page this row checked; null for the home page.
                            outcome:
                              type: string
                              enum:
                                - found
                                - site_key_mismatch
                                - loader_missing
                                - fetch_failed
                              description: "found: the page carries this site's key. site_key_mismatch: a loader with another key. loader_missing: no loader in the page source (a tag manager installs it outside the source, so such a site is verified by its first hit instead). fetch_failed: no page to read, see failure."
                            http_status:
                              type: integer
                              nullable: true
                              description: The final HTTP status; null when no answer arrived.
                            failure:
                              type: string
                              nullable: true
                              enum:
                                - invalid_url
                                - scheme_not_allowed
                                - credentials_in_url
                                - port_not_allowed
                                - ip_literal
                                - host_unresolvable
                                - private_address
                                - redirect_without_location
                                - too_many_redirects
                                - redirected_off_site
                                - connection_failed
                                - http_status
                              description: "Why the fetch failed, when outcome is fetch_failed: the guard refused the URL (scheme, port, credentials, an IP literal, a private address), the host did not resolve, the redirects ran out or left the site, the connection failed, or the status was outside 2xx. Null otherwise."
                          required:
                            - url
                            - key_page_sid
                            - outcome
                            - http_status
                            - failure
                        description: The home page first, then the checkable key pages (a pattern that names one URL).
                    required:
                      - outcome
                      - pages
                    description: What the last active check found, page by page; null while no check ran, and cleared by a key rotation.
                  broken_reason:
                    type: string
                    nullable: true
                    enum:
                      - loader_missing
                      - fetch_failed
                      - site_key_mismatch
                      - no_hits
                    description: "Set while broken: loader_missing (the source lost the loader and the hits stopped), fetch_failed (two checks in a row could not read the site while it was silent), site_key_mismatch (another key in the loader), no_hits (a tag-manager install whose hits stopped). Null otherwise."
                  last_hit_at:
                    type: string
                    nullable: true
                    description: ISO 8601 UTC, the newest hit the collector reported; null while nothing was received.
                  hits_count_24h:
                    type: integer
                    minimum: 0
                    description: Hits in the current UTC hour and the 23 before it, refreshed on every hit batch and every check (a rolling window, not "today").
                  identification:
                    type: string
                    enum:
                      - companies
                      - people
                    description: "What a visit to the site may name. companies (default): links carry the recipient's company code and a visit shows the company, never a person. people: visits from the people the team writes to are shown by name."
                  identification_confirmation:
                    type: object
                    nullable: true
                    properties:
                      identification:
                        type: string
                        enum:
                          - companies
                          - people
                        description: "The level confirmed: people covers both levels, companies only itself."
                      confirmed_at:
                        type: string
                        description: ISO 8601 UTC.
                      confirmed_by:
                        type: object
                        properties:
                          actor_type:
                            type: string
                            enum:
                              - user
                              - support
                              - api_key
                              - system
                              - agent
                          actor_sid:
                            type: string
                            nullable: true
                          team_sid:
                            type: string
                          actor_name:
                            type: string
                            nullable: true
                            description: The OAuth client that acted ("Claude", "n8n"); null for a user, an API key or a system job.
                          oauth_client_sid:
                            type: string
                            nullable: true
                            description: The acting OAuth client (id_oc_*); null off the OAuth path.
                          reason:
                            type: string
                            nullable: true
                            description: Why a system actor wrote the row (snapshot_capture_job, ...); null otherwise.
                          permissions:
                            type: object
                            additionalProperties: {}
                            description: "Internal audit context: the grant set the actor held at write time. Not a contract."
                          cluster_id:
                            type: integer
                            nullable: true
                            description: "Internal audit context: the cluster that served the write."
                          trace_id:
                            type: string
                            nullable: true
                            description: "Internal audit context: the trace id of the request that wrote the row."
                        required:
                          - actor_type
                          - actor_sid
                          - team_sid
                          - permissions
                        description: Who confirmed.
                    required:
                      - identification
                      - confirmed_at
                      - confirmed_by
                    description: The customer's latest confirmation of its duties for a level, by whom and when. Links are coded only while it covers the site's level; null = none yet.
                  link_codes_enabled:
                    type: boolean
                    description: Links to this site get a code (the company's or the person's, by identification) when the site is verified, identification_confirmation covers its level and the team switch (signal_settings.website_link_codes) is on. Default true.
                  carrier_linkedin:
                    type: string
                    enum:
                      - fragment
                      - query
                    description: "Where the code rides in a link sent on LinkedIn: fragment (#g_<code>, default) or query (?gs=<code>)."
                  carrier_email:
                    type: string
                    enum:
                      - fragment
                      - query
                    description: "Where the code rides in a link sent by email: query (default) or fragment."
                  consent_mode:
                    type: string
                    enum:
                      - not_required
                      - required
                    description: "not_required (default): the first-party visitor id is stored on the first hit. required: nothing is stored until the site's banner calls gs('consent', true); until then a visit is attributed by the code in the link alone."
                  fingerprint_mode:
                    type: string
