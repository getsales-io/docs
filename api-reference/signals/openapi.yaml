            last_check_result:
              type: object
              nullable: true
              properties:
                outcome:
                  type: string
                  enum:
                    - found
                    - site_key_mismatch
                    - loader_missing
                    - fetch_failed
                  description: "The best outcome over pages: found wins over site_key_mismatch, over loader_missing, over fetch_failed."
                pages:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        description: The URL requested last for this page.
                      key_page_sid:
                        type: string
                        nullable: true
                        description: sg_kp_... the key page this row checked; null for the home page.
                      outcome:
                        type: string
                        enum:
                          - found
                          - site_key_mismatch
                          - loader_missing
                          - fetch_failed
                        description: "found: the page carries this site's key. site_key_mismatch: a loader with another key. loader_missing: no loader in the page source (a tag manager installs it outside the source, so such a site is verified by its first hit instead). fetch_failed: no page to read, see failure."
                      http_status:
                        type: integer
                        nullable: true
                        description: The final HTTP status; null when no answer arrived.
                      failure:
                        type: string
                        nullable: true
                        enum:
                          - invalid_url
                          - scheme_not_allowed
                          - credentials_in_url
                          - port_not_allowed
                          - ip_literal
                          - host_unresolvable
                          - private_address
                          - redirect_without_location
                          - too_many_redirects
                          - redirected_off_site
                          - connection_failed
                          - http_status
                        description: "Why the fetch failed, when outcome is fetch_failed: the guard refused the URL (scheme, port, credentials, an IP literal, a private address), the host did not resolve, the redirects ran out or left the site, the connection failed, or the status was outside 2xx. Null otherwise."
                    required:
                      - url
                      - key_page_sid
                      - outcome
                      - http_status
                      - failure
                  description: The home page first, then the checkable key pages (a pattern that names one URL).
              required:
                - outcome
                - pages
              description: What the last active check found, page by page; null while no check ran, and cleared by a key rotation.
            broken_reason:
              type: string
              nullable: true
              enum:
                - loader_missing
                - fetch_failed
                - site_key_mismatch
                - no_hits
              description: "Set while broken: loader_missing (the source lost the loader and the hits stopped), fetch_failed (two checks in a row could not read the site while it was silent), site_key_mismatch (another key in the loader), no_hits (a tag-manager install whose hits stopped). Null otherwise."
